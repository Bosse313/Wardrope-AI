<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wardrope AI</title>
<style>
:root{--bg:#f7f5fc;--card:#fff;--ink:#211d35;--muted:#746e88;--line:#e9e4f3;--purple:#6346df;--purple2:#efeaff;--green:#e8f8ee;--greenink:#237845;--yellow:#fff4dc;--yellowink:#855b00;--blue:#eaf2ff;--blueink:#19569a;--red:#fff0f0;--redink:#a12d35;--shadow:0 12px 30px #5135a514}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:linear-gradient(135deg,#5736d3,#8066ed);color:#fff;padding:22px 18px}.topin,main{max-width:1120px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;font-size:clamp(30px,6vw,42px);letter-spacing:-.06em}.sub{opacity:.9;margin-top:4px}.nav{max-width:1120px;margin:16px auto;display:flex;gap:8px;flex-wrap:wrap}.nav button,.btn{min-height:44px;border:0;border-radius:13px;padding:11px 16px;font-weight:750;cursor:pointer}.nav button{background:#fff;color:var(--ink);border:1px solid var(--line)}.nav .active,.primary{background:var(--purple);color:#fff}.top .btn{background:#ffffff20;color:#fff;border:1px solid #ffffff55}main{padding:0 14px 40px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.stat{padding:17px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.value{font-size:31px;font-weight:850;color:var(--purple);margin-top:7px}.title{font-size:27px;letter-spacing:-.05em;margin:25px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.card{padding:17px}.card h3{margin:0 0 8px;font-size:20px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink);width:100%;max-width:260px}.item{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.item:first-child{border:0;padding-top:0}.thumb{width:70px;height:70px;border-radius:16px;background:var(--purple2);display:grid;place-items:center;font-size:29px;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{margin-top:7px}.badge{display:inline-block;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:750;margin:2px 5px 2px 0}.clean{background:var(--green);color:var(--greenink)}.worn{background:var(--yellow);color:var(--yellowink)}.wash{background:var(--blue);color:var(--blueink)}.danger{background:var(--red);color:var(--redink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.small{min-height:42px;border:0;border-radius:12px;padding:10px 13px;background:var(--purple2);color:var(--purple);font-weight:750;cursor:pointer}.delete{background:var(--red);color:var(--redink)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:#fff}.modal{position:fixed;inset:0;background:#17112870;display:none;place-items:center;padding:16px;z-index:5}.modal.open{display:grid}.modalbox{width:min(100%,460px);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:21px}.modalbox h2{margin:0 0 13px;font-size:27px;letter-spacing:-.05em}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.field input,.field select{max-width:none}.right{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.money{font-weight:850;color:var(--purple)}.positive{color:var(--greenink)}.negative{color:var(--redink)}
@media(max-width:620px){.topin{align-items:flex-start;flex-direction:column}.top .btn{width:100%}.nav{display:grid;grid-template-columns:repeat(2,1fr);padding:0 14px}.nav button{width:100%;min-height:48px}main{padding:0 12px 30px}.toolbar>*{max-width:none}.item{align-items:flex-start}.item select{display:none}.item .actions{margin-top:9px}.small{min-height:46px;padding:11px 14px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:14px}}
</style></head>
<body>
<header class="top"><div class="topin"><div><h1>Wardrope AI</h1><div class="sub">Dein Kleiderschrank & Vinted-Übersicht</div></div><button class="btn" onclick="openModal('itemModal')">＋ Kleidung hinzufügen</button></div></header>
<nav class="nav"><button class="active" data-tab="home">Start</button><button data-tab="wardrobe">Kleiderschrank</button><button data-tab="outfits">Outfits</button><button data-tab="laundry">Wäsche</button><button data-tab="vinted">Vinted</button></nav><main><div id="app"></div></main>
<div class="modal" id="itemModal"><div class="modalbox"><h2>Neue Kleidung</h2><div class="field"><label>Name</label><input id="inName" placeholder="z. B. Blaue Jeans"></div><div class="field"><label>Kategorie</label><select id="inCat"><option>T-Shirt</option><option>Polo</option><option>Hemd</option><option>Hose</option><option>Jeans</option><option>Jacke</option><option>Pullover</option><option>Schuhe</option><option>Accessoire</option></select></div><div class="field"><label>Farbe</label><input id="inColor" placeholder="z. B. Blau"></div><div class="field"><label>Stil</label><select id="inStyle"><option>Casual</option><option>Smart Casual</option><option>Sportlich</option><option>Elegant</option><option>Urban</option></select></div><div class="field"><label>Foto optional</label><input id="inImage" type="file" accept="image/*"></div><div class="right"><button class="btn" onclick="closeModal('itemModal')">Abbrechen</button><button class="btn primary" onclick="addItem()">Speichern</button></div></div></div>
<div class="modal" id="vintedModal"><div class="modalbox"><h2>Vinted-Artikel</h2><div class="field"><label>Name</label><input id="vName" placeholder="z. B. Levi's 501"></div><div class="field"><label>Kategorie</label><input id="vCat" placeholder="z. B. Jeans"></div><div class="field"><label>Größe</label><input id="vSize" placeholder="M / 32 / 36"></div><div class="field"><label>Kaufpreis (€)</label><input id="vBuy" type="number" step=".01"></div><div class="field"><label>Verkaufspreis (€)</label><input id="vSell" type="number" step=".01"></div><div class="field"><label>Foto optional</label><input id="vImage" type="file" accept="image/*"></div><div class="right"><button class="btn" onclick="closeModal('vintedModal')">Abbrechen</button><button class="btn primary" onclick="addVinted()">Speichern</button></div></div></div>
<script>
const IK='wardrope-ai-items-v2',VK='wardrope-ai-vinted-v2';let tab='home',filter='Alle',search='';
const oldItems=JSON.parse(localStorage.getItem(IK)||'null'),oldVinted=JSON.parse(localStorage.getItem(VK)||'null');
let items=oldItems||[{id:1,name:'Weißes T-Shirt',category:'T-Shirt',color:'Weiß',style:'Casual',status:'clean',image:''},{id:2,name:'Dunkle Jeans',category:'Jeans',color:'Blau',style:'Casual',status:'clean',image:''},{id:3,name:'Schwarze Sneaker',category:'Schuhe',color:'Schwarz',style:'Casual',status:'clean',image:''}];
let vinted=oldVinted||[];
function save(){localStorage.setItem(IK,JSON.stringify(items));localStorage.setItem(VK,JSON.stringify(vinted))}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function icon(c){return ({'T-Shirt':'👕',Polo:'👕',Hemd:'👔',Hose:'👖',Jeans:'👖',Jacke:'🧥',Pullover:'🧶',Schuhe:'👟',Accessoire:'🧢'})[c]||'👚'}function status(s){return s==='clean'?'Sauber':s==='worn'?'Getragen':'Wäsche'}function cls(s){return s==='clean'?'clean':s==='worn'?'worn':'wash'}
function photo(file){return new Promise((ok,no)=>{if(!file)return ok('');let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}function removeItem(id){if(confirm('Dieses Kleidungsstück wirklich löschen?')){items=items.filter(x=>x.id!==id);save();render()}}function removeVinted(id){if(confirm('Diesen Vinted-Artikel wirklich löschen?')){vinted=vinted.filter(x=>x.id!==id);save();render()}}function setStatus(id,s){let x=items.find(x=>x.id===id);if(x){x.status=s;if(s==='worn')x.lastWornAt=Date.now();save();render()}}function vStatus(id,s){let x=vinted.find(x=>x.id===id);if(x){x.status=s;x.soldAt=s==='verkauft'?new Date().toISOString():null;save();render()}}
function itemCard(x){return `<div class="card item"><div class="thumb">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:icon(x.category)}</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.category)} · ${esc(x.color||'')} · ${esc(x.style||'')}</div><div class="badges"><span class="badge ${cls(x.status)}">${status(x.status)}</span></div><div class="actions"><button class="small" onclick="setStatus(${x.id},'clean')">Sauber</button><button class="small" onclick="setStatus(${x.id},'worn')">Getragen</button><button class="small" onclick="setStatus(${x.id},'in_wash')">Wäsche</button><button class="small delete" onclick="removeItem(${x.id})">Löschen</button></div></div></div>`}
function outfits(){let t=items.filter(x=>x.status==='clean'&&['T-Shirt','Polo','Hemd'].includes(x.category)),b=items.filter(x=>x.status==='clean'&&['Hose','Jeans'].includes(x.category)),s=items.filter(x=>x.status==='clean'&&x.category==='Schuhe');if(!t.length||!b.length||!s.length)return '<div class="empty">Füge Oberteil, Hose und Schuhe hinzu.</div>';return [0,1,2].map(i=>{let set=[t[i%t.length],b[i%b.length],s[i%s.length]];return `<div class="card"><h3>${['Casual Look','Smart Casual','Weekend Style'][i]}</h3><div class="muted">${set.map(x=>icon(x.category)+' '+esc(x.name)).join(' · ')}</div><div class="actions"><button class="btn primary" onclick="wear(${set.map(x=>x.id).join(',')})">Heute tragen</button><button class="small" onclick="alert('Andere saubere Artikel derselben Kategorie werden im Kleiderschrank angezeigt.')">Alternativen</button></div></div>`}).join('')}
function wear(...ids){ids.forEach(id=>{let x=items.find(x=>x.id===id);if(x){x.status='worn';x.lastWornAt=Date.now()}});save();render()}
function render(){let a=document.getElementById('app');if(tab==='home'){a.innerHTML=`<div class="stats"><div class="stat"><div class="label">Gesamt</div><div class="value">${items.length}</div></div><div class="stat"><div class="label">Sauber</div><div class="value">${items.filter(x=>x.status==='clean').length}</div></div><div class="stat"><div class="label">Wäsche</div><div class="value">${items.filter(x=>x.status==='in_wash').length}</div></div><div class="stat"><div class="label">Vinted Profit</div><div class="value">€${vinted.filter(x=>x.status==='verkauft').reduce((n,x)=>n+Number(x.sell||0)-Number(x.buy||0),0).toFixed(2)}</div></div></div><h2 class="title">Deine Outfits</h2><div class="grid">${outfits()}</div>`}else if(tab==='wardrobe'){let cats=['Alle',...new Set(items.map(x=>x.category))],list=items.filter(x=>(filter==='Alle'||x.category===filter)&&x.name.toLowerCase().includes(search.toLowerCase()));a.innerHTML=`<div class="toolbar"><select onchange="filter=this.value;render()">${cats.map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select><input value="${esc(search)}" oninput="search=this.value;render()" placeholder="Kleidung suchen"></div><div class="grid">${list.length?list.map(itemCard).join(''):'<div class="empty">Keine Kleidung gefunden.</div>'}</div>`}else if(tab==='outfits')a.innerHTML=`<h2 class="title">Outfit-Vorschläge</h2><div class="grid">${outfits()}</div>`;else if(tab==='laundry'){let list=items.filter(x=>x.status==='in_wash');a.innerHTML=list.length?`<h2 class="title">Wäsche</h2><div class="grid">${list.map(itemCard).join('')}</div>`:'<div class="empty">Keine Wäsche. Alles sauber!</div>'}else renderVinted()}
function renderVinted(){let lager=vinted.filter(x=>x.status!=='verkauft'),sold=vinted.filter(x=>x.status==='verkauft'),income=sold.reduce((n,x)=>n+Number(x.sell||0),0),profit=sold.reduce((n,x)=>n+Number(x.sell||0)-Number(x.buy||0),0);let card=x=>`<div class="card"><div class="item"><div class="thumb">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:'🧺'}</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.category)} · Größe ${esc(x.size||'-')}</div><div class="muted">Kauf €${Number(x.buy||0).toFixed(2)} · Verkauf €${Number(x.sell||0).toFixed(2)}</div><span class="badge ${x.status==='verkauft'?'clean':'wash'}">${x.status==='verkauft'?'Verkauft':'Im Lager'}</span></div></div><div class="actions"><button class="small" onclick="vStatus(${x.id},'lager')">Ins Lager</button><button class="btn primary" onclick="vStatus(${x.id},'verkauft')">Als verkauft</button><button class="small delete" onclick="removeVinted(${x.id})">Löschen</button></div></div>`;document.getElementById('app').innerHTML=`<div class="stats"><div class="stat"><div class="label">Im Lager</div><div class="value">${lager.length}</div></div><div class="stat"><div class="label">Verkauft</div><div class="value">${sold.length}</div></div><div class="stat"><div class="label">Einnahmen</div><div class="value">€${income.toFixed(2)}</div></div><div class="stat"><div class="label">Profit</div><div class="value">€${profit.toFixed(2)}</div></div></div><div class="toolbar"><button class="btn primary" onclick="openModal('vintedModal')">＋ Produkt hinzufügen</button></div><h2 class="title">Vinted Lager</h2><div class="grid">${lager.length?lager.map(card).join(''):'<div class="empty">Das Lager ist leer.</div>'}</div><h2 class="title">Verkauft</h2><div class="grid">${sold.length?sold.map(card).join(''):'<div class="empty">Noch keine Verkäufe.</div>'}</div>`}
async function addItem(){let n=inName.value.trim();if(!n)return alert('Bitte Name eingeben');items.unshift({id:Date.now(),name:n,category:inCat.value,color:inColor.value||'Keine Farbe',style:inStyle.value,status:'clean',image:await photo(inImage.files[0])});save();closeModal('itemModal');render()}async function addVinted(){let n=vName.value.trim();if(!n)return alert('Bitte Name eingeben');vinted.unshift({id:Date.now(),name:n,category:vCat.value||'Artikel',size:vSize.value||'-',buy:Number(vBuy.value||0),sell:Number(vSell.value||0),status:'lager',image:await photo(vImage.files[0])});save();closeModal('vintedModal');render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});items=items.map(x=>x.status==='worn'&&x.lastWornAt&&Date.now()-x.lastWornAt>86400000?({...x,status:'in_wash'}):x);save();render();
</script></body></html>
