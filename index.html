<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wardrope AI</title>
<style>
:root{--bg:#090909;--card:#171717;--gold:#d8b66a;--gold2:#f5dfa4;--ink:#fff8ec;--muted:#b9aa8d;--line:#49391f;--green:#a9edc5;--yellow:#f5d98c;--blue:#bde0ff;--red:#ffb9bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#302411,#090909 42%);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111c;border-bottom:1px solid var(--line);backdrop-filter:blur(18px);position:sticky;top:0;z-index:3}.head,main,.nav{max-width:1160px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px 14px}h1{margin:0;color:var(--gold2);font-size:clamp(32px,6vw,50px);letter-spacing:-.07em}.sub{color:var(--muted);margin-top:5px;font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:15px 14px}.nav button,.btn,.small{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#171717;color:var(--ink);padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.nav button.active,.primary{background:linear-gradient(135deg,#bd9146,#e8ca79);color:#171108;border-color:var(--gold)}main{padding:0 14px 40px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.stat,.card{background:linear-gradient(145deg,#1d1d1d,#111);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 45px #0009}.stat{padding:17px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800}.value{color:var(--gold2);font-size:31px;font-weight:900;margin-top:8px}.title{color:var(--gold2);font-size:clamp(25px,4vw,36px);letter-spacing:-.05em;margin:27px 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:15px}.card{padding:17px}.card h3{color:var(--gold2);margin:0 0 8px;font-size:21px}.muted,.tag{color:var(--muted);font-size:13px;line-height:1.45}.toolbar,.actions,.tags{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:17px}input,select{width:100%;min-height:47px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#101010;color:var(--ink);font:inherit}.toolbar input,.toolbar select{max-width:270px}.item{display:flex;gap:13px;align-items:flex-start}.thumb{width:80px;height:80px;flex:none;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:#2a2011;border:1px solid #684d24;font-size:30px}.thumb img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.name{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{margin-top:5px}.badges,.actions{margin-top:10px}.badge,.pill{border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800}.clean{background:#16442f;color:var(--green)}.worn{background:#5c4618;color:var(--yellow)}.wash{background:#183b5d;color:var(--blue)}.pill{border:1px solid var(--line);color:var(--gold2);background:#211a0d}.small{min-height:40px;padding:8px 11px;font-size:12px}.delete{background:#632a2e;color:var(--red);border-color:#87434a}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.scene{height:300px;margin:12px 0;border:1px solid #624c28;border-radius:18px;background:radial-gradient(circle,#382812,#111 70%);display:grid;place-items:center;perspective:1100px;touch-action:none;cursor:grab;overflow:hidden}.scene:active{cursor:grabbing}.look{width:190px;height:250px;position:relative;transform-style:preserve-3d}.piece{position:absolute;left:50%;transform:translateX(-50%);overflow:hidden;border:1px solid #c9a657;box-shadow:0 10px 18px #0009;background:#282828}.piece img{width:100%;height:100%;object-fit:cover}.top-piece{top:10px;width:116px;height:105px;border-radius:22px 22px 14px 14px}.bottom-piece{top:108px;width:88px;height:105px;border-radius:10px 10px 18px 18px}.shoe-piece{top:214px;width:52px;height:20px;border-radius:14px 14px 5px 5px;background:#c9a34c;left:38%}.shoe-piece.right{left:62%}.layer-piece{top:2px;width:128px;height:64px;border-radius:15px;background:#735b29}.rotate{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:16px;z-index:10}.modal.open{display:grid}.modalbox{width:min(100%,500px);max-height:92vh;overflow:auto;background:#171717;border:1px solid var(--line);border-radius:23px;padding:21px}.modalbox h2{margin:0;color:var(--gold2);font-size:28px}.field{margin-top:13px}.field label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;margin-bottom:6px}.field input,.field select{max-width:none}.right{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:680px){.head{align-items:flex-start;flex-direction:column}.head .btn{width:100%}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.nav button{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar>*{max-width:none}}
</style></head>
<body><header><div class="head"><div><h1>Wardrope AI</h1><div class="sub">Dein digitaler Kleiderschrank</div></div><button class="btn primary" onclick="openModal('itemModal')">＋ Kleidung hinzufügen</button></div></header><nav class="nav"><button class="active" data-tab="home">Start</button><button data-tab="wardrobe">Kleiderschrank</button><button data-tab="outfits">Outfits</button><button data-tab="laundry">Wäsche</button><button data-tab="vinted">Vinted</button></nav><main><div id="app"></div></main>
<div class="modal" id="itemModal"><div class="modalbox"><h2>Neue Kleidung</h2><div class="field"><label>Name</label><input id="itemName" placeholder="z. B. Weißes T-Shirt"></div><div class="field"><label>Kategorie</label><select id="itemCategory"><option>T-Shirt</option><option>Polo</option><option>Hemd</option><option>Jeans</option><option>Hose</option><option>Jacke</option><option>Pullover</option><option>Schuhe</option><option>Accessoire</option></select></div><div class="field"><label>Farbe</label><input id="itemColor" placeholder="z. B. Blau"></div><div class="field"><label>Stil</label><select id="itemStyle"><option>Casual</option><option>Smart Casual</option><option>Sportlich</option><option>Elegant</option><option>Urban</option></select></div><div class="field"><label>Foto optional</label><input id="itemImage" type="file" accept="image/*"></div><div class="right"><button class="btn" onclick="closeModal('itemModal')">Abbrechen</button><button class="btn primary" onclick="addItem()">Speichern</button></div></div></div>
<div class="modal" id="vintedModal"><div class="modalbox"><h2>Vinted-Artikel</h2><div class="field"><label>Name</label><input id="vName"></div><div class="field"><label>Kategorie</label><input id="vCat"></div><div class="field"><label>Größe</label><input id="vSize"></div><div class="field"><label>Kaufpreis</label><input id="vBuy" type="number" step=".01"></div><div class="field"><label>Verkaufspreis</label><input id="vSell" type="number" step=".01"></div><div class="field"><label>Foto optional</label><input id="vImage" type="file" accept="image/*"></div><div class="right"><button class="btn" onclick="closeModal('vintedModal')">Abbrechen</button><button class="btn primary" onclick="addVinted()">Speichern</button></div></div></div>
<script>
/* v4 deliberately migrates every previous localStorage generation instead of replacing it. */
const ITEM_KEYS=['wardrope-ai-items-v1','wardrope-ai-items-v2','wardrope-ai-items-v3','wardrope-ai-items-v4','wardrope-items'];const VINTED_KEYS=['wardrope-ai-vinted-v1','wardrope-ai-vinted-v2','wardrope-ai-vinted-v3','wardrope-ai-vinted-v4','wardrope-vinted'];const IK='wardrope-ai-items-v4',VK='wardrope-ai-vinted-v4';let tab='home',filter='Alle',search='';
function readAll(keys){const out=[];for(const key of keys){try{const data=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(data))out.push(...data)}catch(e){}}const seen=new Set;return out.filter(x=>{const signature=String(x.id||'')+'|'+String(x.name||'').trim().toLowerCase()+'|'+String(x.category||'').trim().toLowerCase();if(seen.has(signature))return false;seen.add(signature);return true})}
let items=readAll(ITEM_KEYS),vinted=readAll(VINTED_KEYS);if(!items.length)items=[{id:Date.now()+1,name:'Weißes T-Shirt',category:'T-Shirt',color:'Weiß',style:'Casual',status:'clean',image:''},{id:Date.now()+2,name:'Dunkle Jeans',category:'Jeans',color:'Blau',style:'Casual',status:'clean',image:''},{id:Date.now()+3,name:'Schwarze Sneaker',category:'Schuhe',color:'Schwarz',style:'Casual',status:'clean',image:''}];
function save(){localStorage.setItem(IK,JSON.stringify(items));localStorage.setItem(VK,JSON.stringify(vinted))}save();function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function read(file){return new Promise(ok=>{if(!file)return ok('');const r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(file)})}function icon(c){return ({'T-Shirt':'👕',Polo:'👕',Hemd:'👔',Jeans:'👖',Hose:'👖',Jacke:'🧥',Pullover:'🧶',Schuhe:'👟',Accessoire:'🧢'})[c]||'👚'}function role(x){const t=((x.category||'')+' '+(x.name||'')).toLowerCase();if(/schuh|sneaker|boot|stiefel|loafer|sandale/.test(t))return'shoes';if(/hose|jeans|chino|short|rock|skirt/.test(t))return'bottom';if(/jacke|mantel|blazer|pullover|hoodie|cardigan|weste/.test(t))return'layer';if(/t-shirt|shirt|polo|hemd|top|bluse/.test(t))return'top';return null}function status(s){return s==='clean'?'Sauber':s==='worn'?'Getragen':s==='in_wash'?'Wäsche':'Lager'}function statusClass(s){return s==='clean'?'clean':s==='worn'?'worn':'wash'}
function setStatus(id,s){const x=items.find(i=>i.id===id);if(!x)return;x.status=s;if(s==='worn')x.lastWornAt=Date.now();save();render()}function delItem(id){if(confirm('Kleidungsstück löschen?')){items=items.filter(x=>x.id!==id);save();render()}}function vStatus(id,s){const x=vinted.find(i=>i.id===id);if(!x)return;x.status=s;save();render()}function delVinted(id){if(confirm('Vinted-Artikel löschen?')){vinted=vinted.filter(x=>x.id!==id);save();render()}}
function itemCard(x){return `<div class="card item"><div class="thumb">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:icon(x.category)}</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="tag">${esc(x.category)} · ${esc(x.color||'')} · ${esc(x.style||'')}</div><div class="badges"><span class="badge ${statusClass(x.status)}">${status(x.status)}</span></div><div class="actions"><button class="small" onclick="setStatus(${x.id},'clean')">Sauber</button><button class="small" onclick="setStatus(${x.id},'worn')">Getragen</button><button class="small" onclick="setStatus(${x.id},'in_wash')">Wäsche</button><button class="small delete" onclick="delItem(${x.id})">Löschen</button></div></div></div>`}
let drag=null;function startDrag(e,i){const s=e.currentTarget;s.setPointerCapture(e.pointerId);drag={i,x:e.clientX,y:e.clientY,rx:-8,ry:18};s.onpointermove=move;s.onpointerup=end;s.onpointercancel=end}function move(e){if(!drag)return;const look=document.getElementById('look'+drag.i);look.style.transform=`rotateX(${drag.rx-(e.clientY-drag.y)*.45}deg) rotateY(${drag.ry+(e.clientX-drag.x)*.7}deg)`}function end(){drag=null}
function piece(x,cl){if(!x)return'';return `<div class="piece ${cl}">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:icon(x.category)}</div>`}function outfitCard(i,set){return `<div class="card"><h3>${['Casual Look','Smart Casual','Weekend','Night Out'][i%4]}</h3><div class="muted">Automatisch aus deinen aktuellen sauberen Artikeln.</div><div class="scene" onpointerdown="startDrag(event,${i})"><div class="look" id="look${i}">${piece(set.find(x=>role(x)==='top'),'top-piece')}${piece(set.find(x=>role(x)==='bottom'),'bottom-piece')}${piece(set.find(x=>role(x)==='shoes'),'shoe-piece')}${piece(set.find(x=>role(x)==='shoes'),'shoe-piece right')}${piece(set.find(x=>role(x)==='layer'),'layer-piece')}</div></div><div class="rotate">Mit Maus oder Finger drehen</div><div class="tags">${set.map(x=>`<span class="pill">${icon(x.category)} ${esc(x.name)}</span>`).join('')}</div><div class="actions"><button class="btn primary" onclick="wear(${set.map(x=>x.id).join(',')})">Heute tragen</button></div></div>`}
function outfits(){const clean=items.filter(x=>x.status==='clean'),tops=clean.filter(x=>role(x)==='top'),bottoms=clean.filter(x=>role(x)==='bottom'),shoes=clean.filter(x=>role(x)==='shoes'),layers=clean.filter(x=>role(x)==='layer');if(!tops.length||!bottoms.length||!shoes.length)return'<div class="empty">Für ein Outfit braucht die App mindestens ein sauberes Oberteil, eine Hose und Schuhe. Neue Artikel werden nach dem Speichern sofort berücksichtigt.</div>';let html='';for(let i=0;i<Math.min(6,Math.max(3,tops.length*bottoms.length*shoes.length));i++){const set=[tops[i%tops.length],bottoms[(i+1)%bottoms.length],shoes[(i+2)%shoes.length]];if(layers.length&&i%2===0)set.push(layers[i%layers.length]);html+=outfitCard(i,set)}return html}function wear(...ids){ids.forEach(id=>{const x=items.find(i=>i.id===id);if(x){x.status='worn';x.lastWornAt=Date.now()}});save();render()}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const a=document.getElementById('app');if(tab==='home'){const sold=vinted.filter(x=>x.status==='verkauft');a.innerHTML=`<div class="stats"><div class="stat"><div class="label">Kleidung</div><div class="value">${items.length}</div></div><div class="stat"><div class="label">Sauber</div><div class="value">${items.filter(x=>x.status==='clean').length}</div></div><div class="stat"><div class="label">Wäsche</div><div class="value">${items.filter(x=>x.status==='in_wash').length}</div></div><div class="stat"><div class="label">Profit</div><div class="value">€${sold.reduce((n,x)=>n+Number(x.sell||0)-Number(x.buy||0),0).toFixed(2)}</div></div></div><h2 class="title">Deine Outfits</h2><div class="grid">${outfits()}</div>`}else if(tab==='wardrobe'){const cats=['Alle',...new Set(items.map(x=>x.category))],list=items.filter(x=>(filter==='Alle'||x.category===filter)&&String(x.name||'').toLowerCase().includes(search.toLowerCase()));a.innerHTML=`<div class="toolbar"><select onchange="filter=this.value;render()">${cats.map(x=>`<option ${x===filter?'selected':''}>${esc(x)}</option>`).join('')}</select><input value="${esc(search)}" oninput="search=this.value;render()" placeholder="Kleidung suchen"></div><div class="grid">${list.length?list.map(itemCard).join(''):'<div class="empty">Keine Kleidung gefunden.</div>'}</div>`}else if(tab==='outfits')a.innerHTML=`<h2 class="title">Outfit-Studio</h2><div class="grid">${outfits()}</div>`;else if(tab==='laundry'){const list=items.filter(x=>x.status==='in_wash');a.innerHTML=list.length?`<h2 class="title">Wäsche</h2><div class="grid">${list.map(itemCard).join('')}</div>`:'<div class="empty">Alles sauber.</div>'}else renderVinted()}
function renderVinted(){const stored=vinted.filter(x=>x.status!=='verkauft'),sold=vinted.filter(x=>x.status==='verkauft'),income=sold.reduce((n,x)=>n+Number(x.sell||0),0),profit=sold.reduce((n,x)=>n+Number(x.sell||0)-Number(x.buy||0),0),card=x=>`<div class="card item"><div class="thumb">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:'🧺'}</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="tag">${esc(x.category)} · Größe ${esc(x.size||'-')}</div><div class="tag">Kauf €${Number(x.buy||0).toFixed(2)} · Verkauf €${Number(x.sell||0).toFixed(2)}</div><div class="badges"><span class="badge ${x.status==='verkauft'?'clean':'wash'}">${x.status==='verkauft'?'Verkauft':'Im Lager'}</span></div><div class="actions"><button class="small" onclick="vStatus(${x.id},'lager')">Im Lager</button><button class="small" onclick="vStatus(${x.id},'verkauft')">Als verkauft</button><button class="small delete" onclick="delVinted(${x.id})">Löschen</button></div></div></div>`;document.getElementById('app').innerHTML=`<div class="stats"><div class="stat"><div class="label">Lager</div><div class="value">${stored.length}</div></div><div class="stat"><div class="label">Verkauft</div><div class="value">${sold.length}</div></div><div class="stat"><div class="label">Einnahmen</div><div class="value">€${income.toFixed(2)}</div></div><div class="stat"><div class="label">Profit</div><div class="value">€${profit.toFixed(2)}</div></div></div><div class="actions" style="margin:18px 0"><button class="btn primary" onclick="openModal('vintedModal')">＋ Vinted-Artikel</button></div><h2 class="title">Lager</h2><div class="grid">${stored.length?stored.map(card).join(''):'<div class="empty">Lager leer.</div>'}</div><h2 class="title">Verkauft</h2><div class="grid">${sold.length?sold.map(card).join(''):'<div class="empty">Keine Verkäufe.</div>'}</div>`}
async function addItem(){const name=document.getElementById('itemName').value.trim();if(!name)return alert('Bitte einen Namen eingeben.');items.unshift({id:Date.now(),name,category:document.getElementById('itemCategory').value,color:document.getElementById('itemColor').value||'Nicht angegeben',style:document.getElementById('itemStyle').value,status:'clean',image:await read(document.getElementById('itemImage').files[0])});save();closeModal('itemModal');render()}async function addVinted(){const name=document.getElementById('vName').value.trim();if(!name)return alert('Bitte einen Namen eingeben.');vinted.unshift({id:Date.now(),name,category:document.getElementById('vCat').value||'Artikel',size:document.getElementById('vSize').value||'-',buy:Number(document.getElementById('vBuy').value||0),sell:Number(document.getElementById('vSell').value||0),status:'lager',image:await read(document.getElementById('vImage').files[0])});save();closeModal('vintedModal');render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});items=items.map(x=>x.status==='worn'&&x.lastWornAt&&Date.now()-Number(x.lastWornAt)>86400000?({...x,status:'in_wash'}):x);save();render();
</script></body></html>
