<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wardrope AI</title>
<style>
:root{--bg:#080808;--panel:#151515;--gold:#d8b66a;--gold2:#f4dc9d;--ink:#faf5ea;--muted:#b7aa91;--line:#493a22;--soft:#211b11;--red:#632a2e;--shadow:0 18px 45px #000b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#302411,#080808 42%);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.top{padding:23px 18px;background:#0c0c0ccc;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.topin,main,.nav{max-width:1160px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;color:var(--gold2);font-size:clamp(32px,6vw,50px);letter-spacing:-.07em}.sub{color:var(--muted);margin-top:6px}.nav{display:flex;gap:9px;flex-wrap:wrap;padding:16px 14px}.btn,.nav button,.small{border:1px solid var(--line);border-radius:13px;min-height:46px;padding:11px 15px;font-weight:800;cursor:pointer;background:#151515;color:var(--ink)}.primary,.nav .active{background:linear-gradient(135deg,#bd9145,#e8c979);color:#181108;border-color:var(--gold)}main{padding:0 14px 45px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}.stat,.card{background:linear-gradient(145deg,#1c1c1c,#111);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow)}.stat{padding:17px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}.value{font-size:32px;color:var(--gold2);font-weight:900;margin-top:8px}.title{margin:27px 0 13px;color:var(--gold2);font-size:clamp(25px,4vw,36px);letter-spacing:-.05em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:15px}.card{padding:18px}.card h3{margin:0 0 8px;color:var(--gold2);font-size:22px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}input,select{width:100%;max-width:270px;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#101010;color:var(--ink);font:inherit}.item{display:flex;gap:13px;align-items:flex-start}.thumb{width:78px;height:78px;flex:none;border-radius:17px;display:grid;place-items:center;overflow:hidden;font-size:31px;background:#2a2114;border:1px solid #674f27}.thumb img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.name{font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{color:var(--muted);font-size:12px;margin-top:5px}.badges,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800;text-transform:uppercase}.clean{background:#16422e;color:#a7edc5}.worn{background:#5a4519;color:#f7d98c}.wash{background:#183753;color:#b8dcff}.small{min-height:42px;padding:9px 12px;color:var(--gold2)}.small.delete{background:var(--red);color:#ffbbc0;border-color:#87434a}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#000d;place-items:center;padding:16px;z-index:10}.modal.open{display:grid}.modalbox{width:min(100%,500px);max-height:92vh;overflow:auto;background:#171717;border:1px solid var(--line);border-radius:24px;padding:21px}.modalbox h2{margin:0;color:var(--gold2);font-size:28px}.field{margin-top:13px}.field label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;margin-bottom:7px}.field input,.field select{max-width:none}.right{display:flex;justify-content:flex-end;gap:9px;margin-top:19px;flex-wrap:wrap}
/* A practical outfit presentation: each item is shown as a real image/card and the complete look rotates in 3D. */.outfit-card{overflow:hidden}.scene{height:330px;margin:13px 0;border:1px solid #624c28;border-radius:18px;background:radial-gradient(circle,#3a2a13,#111 68%);display:grid;place-items:center;perspective:1100px;touch-action:none;cursor:grab;user-select:none}.scene:active{cursor:grabbing}.look{width:210px;height:270px;position:relative;transform-style:preserve-3d;transition:transform .08s linear}.look-shadow{position:absolute;bottom:0;left:15px;width:180px;height:20px;background:#0008;border-radius:50%;filter:blur(7px);transform:rotateX(65deg) translateZ(-25px)}.piece{position:absolute;left:50%;transform:translateX(-50%) translateZ(20px);width:120px;border:1px solid #c9a657;background:#242424;overflow:hidden;box-shadow:0 10px 18px #0008}.piece img{width:100%;height:100%;object-fit:cover;display:block}.piece.top{top:14px;height:108px;border-radius:25px 25px 14px 14px;background:linear-gradient(135deg,#2d2d2d,#c19b4e,#202020);clip-path:polygon(15% 0,85% 0,100% 24%,82% 34%,82% 100%,18% 100%,18% 34%,0 24%)}.piece.bottom{top:112px;height:115px;width:92px;border-radius:10px 10px 20px 20px;background:linear-gradient(90deg,#151b26,#788398,#111721);clip-path:polygon(10% 0,90% 0,76% 100%,56% 100%,50% 35%,44% 100%,24% 100%)}.piece.shoe{top:226px;width:54px;height:22px;border-radius:15px 15px 5px 5px;background:linear-gradient(135deg,#d8b96b,#806027);left:39%}.piece.shoe2{left:62%}.piece.has-image{clip-path:none;border-radius:13px;background:#222}.rotate-note{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.pieces{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.piece-tag{font-size:12px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--gold2)}
@media(max-width:680px){.topin{align-items:flex-start;flex-direction:column}.top .btn{width:100%}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.nav button{width:100%}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar>*{max-width:none}}
</style></head>
<body><header class="top"><div class="topin"><div><h1>Wardrope AI</h1><div class="sub">Dein digitaler Kleiderschrank</div></div><button class="btn primary" onclick="openModal('itemModal')">＋ Kleidung hinzufügen</button></div></header><nav class="nav"><button class="active" data-tab="home">Start</button><button data-tab="wardrobe">Kleiderschrank</button><button data-tab="outfits">Outfits</button><button data-tab="laundry">Wäsche</button><button data-tab="vinted">Vinted</button></nav><main><div id="app"></div></main>
<div class="modal" id="itemModal"><div class="modalbox"><h2>Neue Kleidung</h2><div class="field"><label>Name</label><input id="itemName" placeholder="z. B. Weißes T-Shirt"></div><div class="field"><label>Kategorie</label><select id="itemCategory"><option>T-Shirt</option><option>Polo</option><option>Hemd</option><option>Hose</option><option>Jeans</option><option>Jacke</option><option>Pullover</option><option>Schuhe</option><option>Accessoire</option></select></div><div class="field"><label>Farbe</label><input id="itemColor" placeholder="z. B. Schwarz"></div><div class="field"><label>Stil</label><select id="itemStyle"><option>Casual</option><option>Smart Casual</option><option>Sportlich</option><option>Elegant</option><option>Urban</option></select></div><div class="field"><label>Foto optional</label><input id="itemImage" type="file" accept="image/*"></div><div class="right"><button class="btn" onclick="closeModal('itemModal')">Abbrechen</button><button class="btn primary" onclick="addItem()">Speichern</button></div></div></div>
<div class="modal" id="vintedModal"><div class="modalbox"><h2>Vinted-Artikel</h2><div class="field"><label>Name</label><input id="vName"></div><div class="field"><label>Kategorie</label><input id="vCat"></div><div class="field"><label>Größe</label><input id="vSize"></div><div class="field"><label>Kaufpreis (€)</label><input id="vBuy" type="number" step=".01"></div><div class="field"><label>Verkaufspreis (€)</label><input id="vSell" type="number" step=".01"></div><div class="field"><label>Foto optional</label><input id="vImage" type="file" accept="image/*"></div><div class="right"><button class="btn" onclick="closeModal('vintedModal')">Abbrechen</button><button class="btn primary" onclick="addVinted()">Speichern</button></div></div></div>
<script>
const IK='wardrope-ai-items-v2',VK='wardrope-ai-vinted-v2';let tab='home',filter='Alle',search='';let items=JSON.parse(localStorage.getItem(IK)||'null')||[],vinted=JSON.parse(localStorage.getItem(VK)||'null')||[];
if(!items.length)items=[{id:1,name:'Weißes T-Shirt',category:'T-Shirt',color:'Weiß',style:'Casual',status:'clean',image:''},{id:2,name:'Dunkle Jeans',category:'Jeans',color:'Blau',style:'Casual',status:'clean',image:''},{id:3,name:'Schwarze Sneaker',category:'Schuhe',color:'Schwarz',style:'Casual',status:'clean',image:''}];
function save(){localStorage.setItem(IK,JSON.stringify(items));localStorage.setItem(VK,JSON.stringify(vinted))}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function icon(c){return ({'T-Shirt':'👕',Polo:'👕',Hemd:'👔',Hose:'👖',Jeans:'👖',Jacke:'🧥',Pullover:'🧶',Schuhe:'👟',Accessoire:'🧢'})[c]||'👚'}function read(file){return new Promise(ok=>{if(!file)return ok('');let r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(file)})}function st(s){return s==='clean'?'Sauber':s==='worn'?'Getragen':'Wäsche'}function sc(s){return s==='clean'?'clean':s==='worn'?'worn':'wash'}function setStatus(id,s){let x=items.find(x=>x.id===id);if(x){x.status=s;if(s==='worn')x.lastWornAt=Date.now();save();render()}}function delItem(id){if(confirm('Kleidungsstück löschen?')){items=items.filter(x=>x.id!==id);save();render()}}function delVinted(id){if(confirm('Vinted-Artikel löschen?')){vinted=vinted.filter(x=>x.id!==id);save();render()}}function vStatus(id,s){let x=vinted.find(x=>x.id===id);if(x){x.status=s;x.soldAt=s==='verkauft'?new Date().toISOString():null;save();render()}}
function itemCard(x){return `<div class="card item"><div class="thumb">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:icon(x.category)}</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="tag">${esc(x.category)} · ${esc(x.color||'')} · ${esc(x.style||'')}</div><div class="badges"><span class="badge ${sc(x.status)}">${st(x.status)}</span></div><div class="actions"><button class="small" onclick="setStatus(${x.id},'clean')">Sauber</button><button class="small" onclick="setStatus(${x.id},'worn')">Getragen</button><button class="small" onclick="setStatus(${x.id},'in_wash')">Wäsche</button><button class="small delete" onclick="delItem(${x.id})">Löschen</button></div></div></div>`}
/* Every clean item is considered immediately. Categories are normalized into outfit roles. */function role(x){let c=(x.category||'').toLowerCase(),n=(x.name||'').toLowerCase();if(/schuh|sneaker|boot|stiefel/.test(c+' '+n))return'shoes';if(/hose|jeans|chino|short|rock/.test(c+' '+n))return'bottom';if(/jacke|mantel|blazer|pullover|hoodie|cardigan/.test(c+' '+n))return'layer';if(/t-shirt|shirt|polo|hemd|top|bluse/.test(c+' '+n))return'top';return null}
function rotateStart(e,i){let s=document.getElementById('scene'+i);drag={i,x:e.clientX,y:e.clientY,rx:-8,ry:18};s.setPointerCapture(e.pointerId);s.onpointermove=rotateMove;s.onpointerup=rotateEnd;s.onpointercancel=rotateEnd}let drag=null;function rotateMove(e){if(!drag)return;let m=document.getElementById('look'+drag.i);m.style.transform=`rotateX(${drag.rx-(e.clientY-drag.y)*.45}deg) rotateY(${drag.ry+(e.clientX-drag.x)*.7}deg)`}function rotateEnd(){drag=null}
function piece(item,type,extra=''){let image=item&&item.image?`<img src="${item.image}" alt="${esc(item.name)}">`:'';return `<div class="piece ${type} ${image?'has-image':''} ${extra}">${image}</div>`}function outfitCard(i,set){let top=set.find(x=>role(x)==='top'),bottom=set.find(x=>role(x)==='bottom'),shoes=set.find(x=>role(x)==='shoes'),layer=set.find(x=>role(x)==='layer');return `<div class="card outfit-card"><h3>${['Casual Look','Smart Casual','Weekend Look'][i]}</h3><div class="muted">Komplett aus deiner sauberen Kleidung zusammengestellt.</div><div class="scene" id="scene${i}" onpointerdown="rotateStart(event,${i})"><div class="look" id="look${i}">${piece(top,'top')}${piece(bottom,'bottom')}${piece(shoes,'shoe')}${piece(shoes,'shoe','shoe2')}${layer?piece(layer,'layer'):''}<div class="look-shadow"></div></div></div><div class="rotate-note">Mit Finger oder Maus ziehen · 360° drehbar</div><div class="pieces">${set.map(x=>`<span class="piece-tag">${icon(x.category)} ${esc(x.name)}</span>`).join('')}</div><div class="actions"><button class="btn primary" onclick="wear(${set.map(x=>x.id).join(',')})">Heute tragen</button></div></div>`}
function outfits(){let clean=items.filter(x=>x.status==='clean'),tops=clean.filter(x=>role(x)==='top'),bottoms=clean.filter(x=>role(x)==='bottom'),shoes=clean.filter(x=>role(x)==='shoes'),layers=clean.filter(x=>role(x)==='layer');if(!tops.length||!bottoms.length||!shoes.length)return `<div class="empty">Noch kein vollständiges Outfit. Benötigt werden mindestens ein Oberteil, eine Hose oder ein Rock und Schuhe.<br><br>Neue Artikel werden nach dem Speichern sofort berücksichtigt.</div>`;let count=Math.max(3,Math.min(6,tops.length*bottoms.length*shoes.length));let cards=[];for(let i=0;i<count;i++){let set=[tops[i%tops.length],bottoms[(i+Math.floor(i/ tops.length))%bottoms.length],shoes[(i+2)%shoes.length]];if(layers.length&&i%2===1)set.push(layers[i%layers.length]);cards.push(outfitCard(i,set))}return cards.join('')}
function wear(...ids){ids.forEach(id=>{let x=items.find(x=>x.id===id);if(x){x.status='worn';x.lastWornAt=Date.now()}});save();render()}
function render(){let a=document.getElementById('app');if(tab==='home'){let sold=vinted.filter(x=>x.status==='verkauft');a.innerHTML=`<div class="stats"><div class="stat"><div class="label">Kleidung</div><div class="value">${items.length}</div></div><div class="stat"><div class="label">Sauber</div><div class="value">${items.filter(x=>x.status==='clean').length}</div></div><div class="stat"><div class="label">Wäsche</div><div class="value">${items.filter(x=>x.status==='in_wash').length}</div></div><div class="stat"><div class="label">Profit</div><div class="value">€${sold.reduce((n,x)=>n+Number(x.sell||0)-Number(x.buy||0),0).toFixed(2)}</div></div></div><h2 class="title">Deine Outfits</h2><div class="grid">${outfits()}</div>`}else if(tab==='wardrobe'){let cats=['Alle',...new Set(items.map(x=>x.category))],list=items.filter(x=>(filter==='Alle'||x.category===filter)&&x.name.toLowerCase().includes(search.toLowerCase()));a.innerHTML=`<div class="toolbar"><select onchange="filter=this.value;render()">${cats.map(x=>`<option ${x===filter?'selected':''}>${esc(x)}</option>`).join('')}</select><input value="${esc(search)}" oninput="search=this.value;render()" placeholder="Kleidung suchen"></div><div class="grid">${list.length?list.map(itemCard).join(''):'<div class="empty">Keine Kleidung gefunden.</div>'}</div>`}else if(tab==='outfits')a.innerHTML=`<h2 class="title">Outfit-Studio</h2><p class="muted">Die Vorschläge werden bei jeder Änderung direkt aus deiner sauberen Kleidung neu berechnet.</p><div class="grid">${outfits()}</div>`;else if(tab==='laundry'){let list=items.filter(x=>x.status==='in_wash');a.innerHTML=list.length?`<h2 class="title">Wäsche</h2><div class="grid">${list.map(itemCard).join('')}</div>`:'<div class="empty">Alles sauber.</div>'}else renderVinted()}
function renderVinted(){let lager=vinted.filter(x=>x.status!=='verkauft'),sold=vinted.filter(x=>x.status==='verkauft'),income=sold.reduce((n,x)=>n+Number(x.sell||0),0),profit=sold.reduce((n,x)=>n+Number(x.sell||0)-Number(x.buy||0),0),card=x=>`<div class="card item"><div class="thumb">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:'🧺'}</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="tag">${esc(x.category)} · Größe ${esc(x.size||'-')}</div><div class="tag">Kauf €${Number(x.buy||0).toFixed(2)} · Verkauf €${Number(x.sell||0).toFixed(2)}</div><div class="badges"><span class="badge ${x.status==='verkauft'?'clean':'wash'}">${x.status==='verkauft'?'Verkauft':'Im Lager'}</span></div><div class="actions"><button class="small" onclick="vStatus(${x.id},'lager')">Ins Lager</button><button class="small primary" onclick="vStatus(${x.id},'verkauft')">Als verkauft</button><button class="small delete" onclick="delVinted(${x.id})">Löschen</button></div></div></div>`;document.getElementById('app').innerHTML=`<div class="stats"><div class="stat"><div class="label">Lager</div><div class="value">${lager.length}</div></div><div class="stat"><div class="label">Verkauft</div><div class="value">${sold.length}</div></div><div class="stat"><div class="label">Einnahmen</div><div class="value">€${income.toFixed(2)}</div></div><div class="stat"><div class="label">Profit</div><div class="value">€${profit.toFixed(2)}</div></div></div><div class="actions"><button class="btn primary" onclick="openModal('vintedModal')">＋ Vinted-Artikel</button></div><h2 class="title">Vinted Lager</h2><div class="grid">${lager.length?lager.map(card).join(''):'<div class="empty">Lager leer.</div>'}</div><h2 class="title">Verkauft</h2><div class="grid">${sold.length?sold.map(card).join(''):'<div class="empty">Keine Verkäufe.</div>'}</div>`}
async function addItem(){let n=itemName.value.trim();if(!n)return alert('Bitte einen Namen eingeben.');items.unshift({id:Date.now(),name:n,category:itemCategory.value,color:itemColor.value||'Nicht angegeben',style:itemStyle.value,status:'clean',lastWornAt:null,image:await read(itemImage.files[0])});save();closeModal('itemModal');render()}async function addVinted(){let n=vName.value.trim();if(!n)return alert('Bitte einen Namen eingeben.');vinted.unshift({id:Date.now(),name:n,category:vCat.value||'Artikel',size:vSize.value||'-',buy:Number(vBuy.value||0),sell:Number(vSell.value||0),status:'lager',image:await read(vImage.files[0])});save();closeModal('vintedModal');render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});items=items.map(x=>x.status==='worn'&&x.lastWornAt&&Date.now()-x.lastWornAt>86400000?({...x,status:'in_wash',lastWornAt:null}):x);save();render();
</script></body></html>
