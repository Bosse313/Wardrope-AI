<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wardrope AI</title>
  <style>
    :root {
      --bg: #090909;
      --panel: #151515;
      --panel-2: #1d1d1d;
      --gold: #d8b66a;
      --gold-2: #f4dc9d;
      --ink: #faf5ea;
      --muted: #b7aa91;
      --line: rgba(216, 182, 106, 0.28);
      --red: #632a2e;
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(216,182,106,0.12), transparent 28%), #080808;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { padding-bottom: 40px; }

    .topbar {
      background: rgba(15, 15, 15, 0.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 14px;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      letter-spacing: -0.07em;
      line-height: 0.9;
      color: var(--gold-2);
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 0;
      padding-top: 0;
    }

    .nav button,
    .btn,
    .small-btn {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .nav button:hover,
    .btn:hover,
    .small-btn:hover { transform: translateY(-1px); }

    .nav button {
      min-height: 46px;
      padding: 10px 16px;
      flex: 0 0 auto;
    }

    .nav button.active,
    .btn.primary {
      background: linear-gradient(135deg, rgba(216,182,106,0.3), rgba(244,220,157,0.15));
      border-color: rgba(216,182,106,0.55);
      color: var(--gold-2);
      box-shadow: 0 12px 26px rgba(216,182,106,0.08);
    }

    .btn {
      min-height: 48px;
      padding: 11px 18px;
    }

    .small-btn {
      min-height: 38px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .small-btn.delete {
      background: rgba(99,42,46,0.28);
      border-color: rgba(255,143,151,0.24);
      color: #ffbcc0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat {
      background: linear-gradient(145deg, rgba(30,30,30,0.95), rgba(12,12,12,0.96));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 18px 16px;
    }

    .stat-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
      font-weight: 800;
    }

    .stat-value {
      margin-top: 10px;
      color: var(--gold-2);
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .section-title {
      margin: 28px 0 14px;
      color: var(--gold-2);
      letter-spacing: -0.05em;
      font-size: clamp(24px, 3vw, 36px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(145deg, rgba(25,25,25,0.96), rgba(13,13,13,0.96));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .card h3 {
      margin: 0 0 10px;
      color: var(--gold-2);
      letter-spacing: -0.04em;
      font-size: 22px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: var(--ink);
      font: inherit;
      padding: 12px 14px;
    }

    .toolbar select,
    .toolbar input {
      max-width: 270px;
    }

    .item-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .thumb {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      background: rgba(216,182,106,0.08);
      border: 1px solid rgba(216,182,106,0.24);
      overflow: hidden;
      display: grid;
      place-items: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grow {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .badges,
    .actions {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge.clean { background: rgba(34, 113, 78, 0.18); color: #a9f1c7; }
    .badge.worn { background: rgba(113, 85, 16, 0.2); color: #f7d98c; }
    .badge.wash { background: rgba(26, 72, 124, 0.2); color: #bfe0ff; }

    .empty {
      padding: 28px 18px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    .scene {
      height: 300px;
      border-radius: 18px;
      margin: 12px 0 14px;
      border: 1px solid rgba(216,182,106,0.3);
      background: radial-gradient(circle at center, rgba(216,182,106,0.10), rgba(12,12,12,0.82));
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 1200px;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .scene:active { cursor: grabbing; }

    .look {
      position: relative;
      width: 220px;
      height: 255px;
      transform-style: preserve-3d;
      transition: transform 0.08s ease-out;
    }

    .look-shadow {
      position: absolute;
      bottom: 8px;
      left: 22px;
      width: 170px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      filter: blur(8px);
      transform: rotateX(75deg) translateZ(-20px);
    }

    .piece {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(216,182,106,0.38);
      box-shadow: 0 12px 18px rgba(0,0,0,0.28);
      background: rgba(34,34,34,0.75);
    }

    .piece img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .piece.top {
      top: 14px;
      height: 110px;
      border-radius: 24px 24px 18px 18px;
      background: linear-gradient(135deg, rgba(30,30,30,0.9), rgba(216,182,106,0.5), rgba(22,22,22,0.9));
    }

    .piece.bottom {
      top: 110px;
      width: 96px;
      height: 110px;
      border-radius: 12px 12px 18px 18px;
      background: linear-gradient(180deg, rgba(30,30,30,0.9), rgba(86,96,115,0.9), rgba(15,15,15,0.9));
    }

    .piece.shoe {
      top: 214px;
      width: 54px;
      height: 20px;
      border-radius: 14px 14px 7px 7px;
      background: linear-gradient(135deg, #d8b96b, #71531d);
      left: 38%;
    }

    .piece.shoe.right {
      left: 62%;
    }

    .piece.layer {
      top: 4px;
      height: 70px;
      width: 130px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(60,46,18,.85), rgba(200,170,97,.55), rgba(22,22,22,.8));
    }

    .rotate-note {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--gold-2);
      background: rgba(216,182,106,0.06);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,0.72);
      padding: 18px;
      z-index: 30;
    }

    .modal.open { display: grid; }

    .modal-box {
      width: min(100%, 520px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(25,25,25,0.98), rgba(12,12,12,0.98));
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal-box h2 {
      margin: 0;
      color: var(--gold-2);
      letter-spacing: -0.05em;
      font-size: clamp(26px, 4vw, 34px);
    }

    .field {
      margin-top: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .modal-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 680px) {
      .topbar-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr;
      }

      .toolbar select,
      .toolbar input {
        max-width: none;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title-wrap">
        <h1>Wardrope AI</h1>
        <div class="sub">Digitaler Kleiderschrank</div>
      </div>
      <button class="btn primary" onclick="openModal('itemModal')">＋ Kleidung hinzufügen</button>
    </div>
  </header>

  <div class="container">
    <nav class="nav">
      <button class="active" data-tab="home">Start</button>
      <button data-tab="wardrobe">Kleider</button>
      <button data-tab="outfits">Outfits</button>
      <button data-tab="laundry">Wäsche</button>
      <button data-tab="vinted">Vinted</button>
    </nav>

    <div id="app"></div>
  </div>

  <div class="modal" id="itemModal">
    <div class="modal-box">
      <h2>Neue Kleidung</h2>
      <div class="field">
        <label>Name</label>
        <input id="itemName" placeholder="z. B. Weißes T-Shirt" />
      </div>
      <div class="field">
        <label>Kategorie</label>
        <select id="itemCategory">
          <option>T-Shirt</option>
          <option>Polo</option>
          <option>Hemd</option>
          <option>Jeans</option>
          <option>Hose</option>
          <option>Jacke</option>
          <option>Pullover</option>
          <option>Schuhe</option>
          <option>Accessoire</option>
        </select>
      </div>
      <div class="field">
        <label>Farbe</label>
        <input id="itemColor" placeholder="z. B. Blau" />
      </div>
      <div class="field">
        <label>Stil</label>
        <select id="itemStyle">
          <option>Casual</option>
          <option>Smart Casual</option>
          <option>Sportlich</option>
          <option>Elegant</option>
          <option>Urban</option>
        </select>
      </div>
      <div class="field">
        <label>Foto optional</label>
        <input id="itemImage" type="file" accept="image/*" />
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('itemModal')">Abbrechen</button>
        <button class="btn primary" onclick="addItem()">Speichern</button>
      </div>
    </div>
  </div>

  <div class="modal" id="vintedModal">
    <div class="modal-box">
      <h2>Vinted-Artikel</h2>
      <div class="field">
        <label>Name</label>
        <input id="vintedName" placeholder="z. B. Levi's 501" />
      </div>
      <div class="field">
        <label>Kategorie</label>
        <input id="vintedCategory" placeholder="z. B. Jeans" />
      </div>
      <div class="field">
        <label>Größe</label>
        <input id="vintedSize" placeholder="M / 32 / 36" />
      </div>
      <div class="field">
        <label>Kaufpreis (€)</label>
        <input id="vintedBuy" type="number" step="0.01" placeholder="12.50" />
      </div>
      <div class="field">
        <label>Verkaufspreis (€)</label>
        <input id="vintedSell" type="number" step="0.01" placeholder="22.90" />
      </div>
      <div class="field">
        <label>Foto optional</label>
        <input id="vintedImage" type="file" accept="image/*" />
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('vintedModal')">Abbrechen</button>
        <button class="btn primary" onclick="addVinted()">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const APP_KEY = 'wardrope-ai-items-v3';
    const VINTED_KEY = 'wardrope-ai-vinted-v3';

    let activeTab = 'home';
    let filter = 'Alle';
    let search = '';

    const refs = {
      app: document.getElementById('app'),
      itemModal: document.getElementById('itemModal'),
      vintedModal: document.getElementById('vintedModal'),
      itemName: document.getElementById('itemName'),
      itemCategory: document.getElementById('itemCategory'),
      itemColor: document.getElementById('itemColor'),
      itemStyle: document.getElementById('itemStyle'),
      itemImage: document.getElementById('itemImage'),
      vintedName: document.getElementById('vintedName'),
      vintedCategory: document.getElementById('vintedCategory'),
      vintedSize: document.getElementById('vintedSize'),
      vintedBuy: document.getElementById('vintedBuy'),
      vintedSell: document.getElementById('vintedSell'),
      vintedImage: document.getElementById('vintedImage')
    };

    let items = JSON.parse(localStorage.getItem(APP_KEY) || 'null') || [
      { id: 1, name: 'Weißes T-Shirt', category: 'T-Shirt', color: 'Weiß', style: 'Casual', status: 'clean', image: '' },
      { id: 2, name: 'Dunkle Jeans', category: 'Jeans', color: 'Blau', style: 'Casual', status: 'clean', image: '' },
      { id: 3, name: 'Schwarze Sneaker', category: 'Schuhe', color: 'Schwarz', style: 'Casual', status: 'clean', image: '' }
    ];

    let vinted = JSON.parse(localStorage.getItem(VINTED_KEY) || 'null') || [
      { id: 1, name: 'Levi 501', category: 'Jeans', size: '32', buy: 18.9, sell: 29.0, status: 'lager', image: '' }
    ];

    function saveState() {
      localStorage.setItem(APP_KEY, JSON.stringify(items));
      localStorage.setItem(VINTED_KEY, JSON.stringify(vinted));
    }

    function escapeHtml(input = '') {
      return String(input)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    function normalizeRole(item) {
      const text = `${item.category || ''} ${item.name || ''}`.toLowerCase();
      if (/(t-shirt|shirt|polo|hemd|top|bluse|shirt)/.test(text)) return 'top';
      if (/(hat|hoodie|jacke|blazer|pullover|cardigan|mantel)/.test(text)) return 'layer';
      if (/(hose|jeans|chino|short|rock|skirt)/.test(text)) return 'bottom';
      if (/(schuh|sneaker|boot|stiefel|loafer|sandale)/.test(text)) return 'shoes';
      return null;
    }

    function statusBadge(status) {
      if (status === 'clean') return 'Sauber';
      if (status === 'worn') return 'Getragen';
      if (status === 'in_wash') return 'Wäsche';
      return 'Lager';
    }

    function statusClass(status) {
      if (status === 'clean') return 'clean';
      if (status === 'worn') return 'worn';
      if (status === 'in_wash') return 'wash';
      return 'wash';
    }

    function itemIcon(category) {
      const map = {
        'T-Shirt': '👕',
        'Polo': '👕',
        'Hemd': '👔',
        'Jeans': '👖',
        'Hose': '👖',
        'Jacke': '🧥',
        'Pullover': '🧶',
        'Schuhe': '👟',
        'Accessoire': '🧢'
      };
      return map[category] || '👚';
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('open');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('open');
    }

    function setStatus(itemId, newStatus) {
      const item = items.find(i => i.id === itemId);
      if (!item) return;
      item.status = newStatus;
      if (newStatus === 'worn') item.lastWornAt = Date.now();
      saveState();
      render();
    }

    function deleteItem(itemId) {
      if (!confirm('Kleidungsstück wirklich löschen?')) return;
      items = items.filter(i => i.id !== itemId);
      saveState();
      render();
    }

    function setVintedStatus(itemId, newStatus) {
      const entry = vinted.find(i => i.id === itemId);
      if (!entry) return;
      entry.status = newStatus;
      saveState();
      render();
    }

    function deleteVinted(itemId) {
      if (!confirm('Vinted-Eintrag wirklich löschen?')) return;
      vinted = vinted.filter(i => i.id !== itemId);
      saveState();
      render();
    }

    function createItemCard(item) {
      const imageHtml = item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">` : itemIcon(item.category);
      return `
        <div class="card">
          <div class="item-row">
            <div class="thumb">${imageHtml}</div>
            <div class="grow">
              <div class="item-name">${escapeHtml(item.name)}</div>
              <div class="tag">${escapeHtml(item.category)} · ${escapeHtml(item.color || '')} · ${escapeHtml(item.style || '')}</div>
              <div class="badges">
                <span class="badge ${statusClass(item.status)}">${statusBadge(item.status)}</span>
              </div>
              <div class="actions">
                <button class="small-btn" onclick="setStatus(${item.id}, 'clean')">Sauber</button>
                <button class="small-btn" onclick="setStatus(${item.id}, 'worn')">Getragen</button>
                <button class="small-btn" onclick="setStatus(${item.id}, 'in_wash')">Wäsche</button>
                <button class="small-btn delete" onclick="deleteItem(${item.id})">Löschen</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function createPiece(item, className) {
      if (!item) return '';
      const imageHtml = item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">` : `<div style="display:grid;place-items:center;height:100%;font-size:26px;">${itemIcon(item.category)}</div>`;
      return `<div class="piece ${className}">${imageHtml}</div>`;
    }

    function outfitCard(index, set) {
      const top = set.find(i => normalizeRole(i) === 'top');
      const bottom = set.find(i => normalizeRole(i) === 'bottom');
      const shoes = set.find(i => normalizeRole(i) === 'shoes');
      const layer = set.find(i => normalizeRole(i) === 'layer');

      return `
        <div class="card">
          <h3>${['Casual Look', 'Smart Casual', 'Weekend', 'Night Out'][index % 4]}</h3>
          <div class="muted">Alles aus deiner sauberen Kleidung automatisch kombiniert.</div>
          <div class="scene" data-index="${index}" onpointerdown="startDrag(event, ${index})">
            <div class="look" id="look-${index}">
              ${createPiece(top, 'top')}
              ${createPiece(bottom, 'bottom')}
              ${createPiece(shoes, 'shoe')}
              ${createPiece(shoes, 'shoe right')}
              ${layer ? createPiece(layer, 'layer') : ''}
              <div class="look-shadow"></div>
            </div>
          </div>
          <div class="rotate-note">Drag to rotate</div>
          <div class="tags">
            ${set.map(item => `<span class="tag-pill">${itemIcon(item.category)} ${escapeHtml(item.name)}</span>`).join('')}
          </div>
          <div class="actions">
            <button class="btn primary" onclick="wearOutfit(${set.map(i => i.id).join(',')})">Heute tragen</button>
          </div>
        </div>
      `;
    }

    function generateOutfits() {
      const clean = items.filter(i => i.status === 'clean');
      const tops = clean.filter(i => normalizeRole(i) === 'top');
      const layers = clean.filter(i => normalizeRole(i) === 'layer');
      const bottoms = clean.filter(i => normalizeRole(i) === 'bottom');
      const shoes = clean.filter(i => normalizeRole(i) === 'shoes');

      if (!tops.length || !bottoms.length || !shoes.length) {
        return '<div class="empty">Noch kein vollständiges Outfit verfügbar. Sobald du saubere Oberteile, Hosen und Schuhe hinzugefügt hast, erscheinen hier passende Looks.</div>';
      }

      const outfits = [];
      const max = 4;
      for (let i = 0; i < max; i++) {
        const set = [
          tops[i % tops.length],
          bottoms[(i + 1) % bottoms.length],
          shoes[(i + 2) % shoes.length]
        ];
        if (layers.length && i % 2 === 0) set.push(layers[i % layers.length]);
        outfits.push(outfitCard(i, set));
      }

      return outfits.join('');
    }

    function wearOutfit(...ids) {
      ids.forEach(id => {
        const item = items.find(i => i.id === id);
        if (item) {
          item.status = 'worn';
          item.lastWornAt = Date.now();
        }
      });
      saveState();
      render();
    }

    function renderHome() {
      const cleanCount = items.filter(i => i.status === 'clean').length;
      const washCount = items.filter(i => i.status === 'in_wash').length;
      const wornCount = items.filter(i => i.status === 'worn').length;
      const sold = vinted.filter(i => i.status === 'verkauft');
      const profit = sold.reduce((sum, item) => sum + (Number(item.sell || 0) - Number(item.buy || 0)), 0);

      refs.app.innerHTML = `
        <div class="stats">
          <div class="stat">
            <div class="stat-label">Gesamt</div>
            <div class="stat-value">${items.length}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Sauber</div>
            <div class="stat-value">${cleanCount}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Getragen</div>
            <div class="stat-value">${wornCount}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Profit</div>
            <div class="stat-value">€${profit.toFixed(2)}</div>
          </div>
        </div>

        <h2 class="section-title">Empfohlene Looks</h2>
        <div class="grid">${generateOutfits()}</div>
        <div class="muted" style="margin-top:12px;">${washCount} Kleidungsstücke gerade in der Wäsche.</div>
      `;
    }

    function renderWardrobe() {
      const categories = ['Alle', ...new Set(items.map(i => i.category))];
      const filtered = items.filter(item => {
        const matchesCategory = filter === 'Alle' || item.category === filter;
        const matchesSearch = item.name.toLowerCase().includes(search.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      refs.app.innerHTML = `
        <div class="toolbar">
          <select onchange="filter = this.value; render();">
            ${categories.map(cat => `<option value="${escapeHtml(cat)}" ${cat === filter ? 'selected' : ''}>${escapeHtml(cat)}</option>`).join('')}
          </select>
          <input value="${escapeHtml(search)}" oninput="search = this.value; render();" placeholder="Suche nach Kleidung..." />
        </div>
        <div class="grid">
          ${filtered.length ? filtered.map(createItemCard).join('') : '<div class="empty">Keine Kleidung gefunden.</div>'}
        </div>
      `;
    }

    function renderLaundry() {
      const washing = items.filter(i => i.status === 'in_wash');
      refs.app.innerHTML = washing.length
        ? `<h2 class="section-title">Wäsche</h2><div class="grid">${washing.map(createItemCard).join('')}</div>`
        : '<div class="empty">Alles sauber — im Moment nichts in der Wäsche.</div>';
    }

    function renderVinted() {
      const sold = vinted.filter(i => i.status === 'verkauft');
      const stored = vinted.filter(i => i.status !== 'verkauft');
      const income = sold.reduce((sum, item) => sum + Number(item.sell || 0), 0);
      const profit = sold.reduce((sum, item) => sum + (Number(item.sell || 0) - Number(item.buy || 0)), 0);

      const cardHtml = item => `
        <div class="card">
          <div class="item-row">
            <div class="thumb">${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name)}">` : '🧺'}</div>
            <div class="grow">
              <div class="item-name">${escapeHtml(item.name)}</div>
              <div class="tag">${escapeHtml(item.category)} · Größe ${escapeHtml(item.size || '-')}</div>
              <div class="tag">Kauf: €${Number(item.buy || 0).toFixed(2)} · Verkauf: €${Number(item.sell || 0).toFixed(2)}</div>
              <div class="badges">
                <span class="badge ${item.status === 'verkauft' ? 'clean' : 'wash'}">${item.status === 'verkauft' ? 'Verkauft' : 'Im Lager'}</span>
              </div>
              <div class="actions">
                <button class="small-btn" onclick="setVintedStatus(${item.id}, 'lager')">Im Lager</button>
                <button class="small-btn" onclick="setVintedStatus(${item.id}, 'verkauft')">Als verkauft</button>
                <button class="small-btn delete" onclick="deleteVinted(${item.id})">Löschen</button>
              </div>
            </div>
          </div>
        </div>
      `;

      refs.app.innerHTML = `
        <div class="stats">
          <div class="stat">
            <div class="stat-label">Im Lager</div>
            <div class="stat-value">${stored.length}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Verkauft</div>
            <div class="stat-value">${sold.length}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Einnahmen</div>
            <div class="stat-value">€${income.toFixed(2)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Profit</div>
            <div class="stat-value">€${profit.toFixed(2)}</div>
          </div>
        </div>

        <div class="actions" style="justify-content:flex-start; margin:18px 0 10px;">
          <button class="btn primary" onclick="openModal('vintedModal')">＋ Vinted-Artikel</button>
        </div>

        <h2 class="section-title">Im Lager</h2>
        <div class="grid">${stored.length ? stored.map(cardHtml).join('') : '<div class="empty">Noch keine Artikel im Lager.</div>'}</div>

        <h2 class="section-title">Verkauft</h2>
        <div class="grid">${sold.length ? sold.map(cardHtml).join('') : '<div class="empty">Noch keine Verkäufe erfasst.</div>'}</div>
      `;
    }

    function render() {
      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeTab);
      });

      if (activeTab === 'home') return renderHome();
      if (activeTab === 'wardrobe') return renderWardrobe();
      if (activeTab === 'outfits') return refs.app.innerHTML = `<h2 class="section-title">Outfit-Studio</h2><div class="grid">${generateOutfits()}</div>`;
      if (activeTab === 'laundry') return renderLaundry();
      return renderVinted();
    }

    async function addItem() {
      const name = refs.itemName.value.trim();
      if (!name) {
        alert('Bitte eine Bezeichnung eintragen.');
        return;
      }

      const category = refs.itemCategory.value || 'T-Shirt';
      const image = await readFileAsDataUrl(refs.itemImage.files[0]);

      items.unshift({
        id: Date.now(),
        name,
        category,
        color: refs.itemColor.value || 'Nicht angegeben',
        style: refs.itemStyle.value || 'Casual',
        status: 'clean',
        image
      });

      saveState();
      refs.itemName.value = '';
      refs.itemColor.value = '';
      refs.itemImage.value = '';
      closeModal('itemModal');
      render();
    }

    async function addVinted() {
      const name = refs.vintedName.value.trim();
      if (!name) {
        alert('Bitte einen Namen eingeben.');
        return;
      }

      vinted.unshift({
        id: Date.now(),
        name,
        category: refs.vintedCategory.value || 'Artikel',
        size: refs.vintedSize.value || '-',
        buy: Number(refs.vintedBuy.value || 0),
        sell: Number(refs.vintedSell.value || 0),
        status: 'lager',
        image: await readFileAsDataUrl(refs.vintedImage.files[0])
      });

      saveState();
      refs.vintedName.value = '';
      refs.vintedCategory.value = '';
      refs.vintedSize.value = '';
      refs.vintedBuy.value = '';
      refs.vintedSell.value = '';
      refs.vintedImage.value = '';
      closeModal('vintedModal');
      render();
    }

    let dragState = null;

    function startDrag(event, index) {
      const scene = event.currentTarget;
      const look = document.getElementById('look-' + index);
      if (!look) return;
      dragState = { index, startX: event.clientX, startY: event.clientY, rotateY: 18, rotateX: -10 };
      scene.setPointerCapture(event.pointerId);
      scene.onpointermove = handleDragMove;
      scene.onpointerup = endDrag;
      scene.onpointerleave = endDrag;
    }

    function handleDragMove(event) {
      if (!dragState) return;
      const look = document.getElementById('look-' + dragState.index);
      if (!look) return;
      const dx = event.clientX - dragState.startX;
      const dy = event.clientY - dragState.startY;
      look.style.transform = `rotateX(${dragState.rotateX - dy * 0.5}deg) rotateY(${dragState.rotateY + dx * 0.7}deg)`;
    }

    function endDrag() {
      dragState = null;
      document.querySelectorAll('.scene').forEach(scene => {
        scene.onpointermove = null;
        scene.onpointerup = null;
        scene.onpointerleave = null;
      });
    }

    document.querySelectorAll('[data-tab]').forEach(button => {
      button.addEventListener('click', () => {
        activeTab = button.dataset.tab;
        render();
      });
    });

    items = items.map(item => {
      if (item.status === 'worn' && item.lastWornAt && Date.now() - Number(item.lastWornAt) > 86400000) {
        return { ...item, status: 'in_wash' };
      }
      return item;
    });
    saveState();
    render();
  </script>
</body>
</html>
