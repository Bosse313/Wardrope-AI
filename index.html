<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wardrope AI</title>
  <style>
    :root {
      --bg: #f7f3ff;
      --panel: #ffffff;
      --panel-alt: #f2edff;
      --primary: #5d3fe0;
      --primary-strong: #4726c6;
      --primary-soft: #efeaff;
      --text: #1f1b2d;
      --muted: #5f5d75;
      --line: #e8e2f6;
      --success: #eafaf0;
      --success-text: #1f7a44;
      --warn: #fff3d8;
      --warn-text: #8a5d00;
      --wash: #e7f1ff;
      --wash-text: #124d94;
      --shadow: 0 10px 30px rgba(93, 63, 224, 0.08);
      --danger: #ffe9e9;
      --danger-text: #9a2d2d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; }

    .topbar {
      background: linear-gradient(135deg, var(--primary), #7a60ee);
      color: white;
      padding: 18px 18px 20px;
      box-shadow: 0 10px 24px rgba(91, 63, 224, 0.22);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 { margin: 0; font-size: clamp(30px, 4vw, 40px); letter-spacing: -0.05em; }
    .subtitle { font-size: 14px; opacity: 0.9; margin-top: 4px; }

    .add-btn {
      border: 0;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    main { max-width: 1200px; margin: 0 auto; padding: 14px 14px 30px; }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .nav button {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .nav button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 11px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 8px;
      font-weight: 800;
      font-size: clamp(28px, 4vw, 38px);
      color: var(--primary);
      line-height: 1;
    }

    .section-title {
      font-size: clamp(22px, 3vw, 28px);
      letter-spacing: -0.04em;
      margin: 24px 0 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -0.03em;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .clean { background: var(--success); color: var(--success-text); }
    .worn { background: var(--warn); color: var(--warn-text); }
    .wash { background: var(--wash); color: var(--wash-text); }
    .danger { background: var(--danger); color: var(--danger-text); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    select, input {
      width: 100%;
      max-width: 220px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--text);
      padding: 11px 12px;
      font-size: 14px;
    }

    .item-row {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .item-row:first-child { border-top: 0; padding-top: 0; }

    .thumb {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: var(--panel-alt);
      display: grid;
      place-items: center;
      font-size: 28px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .item-main { flex: 1; min-width: 0; }
    .item-name { font-weight: 700; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { color: var(--muted); font-size: 12px; }

    .small-btn, .pill-btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-btn {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .pill-btn {
      background: var(--primary);
      color: white;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(12, 8, 28, 0.4);
      padding: 18px;
      z-index: 100;
    }

    .modal.open { display: grid; }

    .modal-card {
      width: min(100%, 440px);
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 24px 54px rgba(0,0,0,0.18);
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .field { margin-top: 12px; }
    .field label { display: block; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
    .field input, .field select { width: 100%; max-width: none; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .secondary, .primary {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary { background: #f2f0f7; color: var(--text); }
    .primary { background: var(--primary); color: white; }

    .empty {
      background: white;
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 30px 18px;
      text-align: center;
      color: var(--muted);
    }

    .vinted-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }

    .money {
      font-weight: 800;
      color: var(--primary);
    }

    .profit-positive { color: var(--success-text); }
    .profit-negative { color: var(--danger-text); }

    .muted { color: var(--muted); }

    @media (max-width: 620px) {
      .topbar-inner { flex-direction: column; align-items: flex-start; }
      .nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      select, input { max-width: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>Wardrope AI</h1>
        <div class="subtitle">Dein Kleiderschrank · Outfits · Vinted</div>
      </div>
      <button class="add-btn" onclick="openItemModal()">＋ Kleidung hinzufügen</button>
    </div>
  </header>

  <main>
    <nav class="nav">
      <button class="active" data-tab="home">Start</button>
      <button data-tab="wardrobe">Kleiderschrank</button>
      <button data-tab="outfits">Outfits</button>
      <button data-tab="laundry">Wäsche</button>
      <button data-tab="vinted">Vinted</button>
    </nav>

    <div id="app"></div>
  </main>

  <div id="itemModal" class="modal">
    <div class="modal-card">
      <h2>Neue Kleidung</h2>
      <div class="field">
        <label>Name</label>
        <input id="itemName" placeholder="z. B. Weißes T-Shirt" />
      </div>
      <div class="field">
        <label>Kategorie</label>
        <select id="itemCategory">
          <option>T-Shirt</option>
          <option>Polo</option>
          <option>Hemd</option>
          <option>Hose</option>
          <option>Jeans</option>
          <option>Jacke</option>
          <option>Pullover</option>
          <option>Schuhe</option>
          <option>Accessoire</option>
        </select>
      </div>
      <div class="field">
        <label>Farbe</label>
        <select id="itemColor">
          <option>Weiß</option>
          <option>Schwarz</option>
          <option>Blau</option>
          <option>Marine</option>
          <option>Beige</option>
          <option>Grau</option>
          <option>Rot</option>
          <option>Grün</option>
          <option>Braun</option>
        </select>
      </div>
      <div class="field">
        <label>Stil</label>
        <select id="itemStyle">
          <option>Casual</option>
          <option>Smart Casual</option>
          <option>Sportlich</option>
          <option>Elegant</option>
          <option>Urban</option>
        </select>
      </div>
      <div class="field">
        <label>Foto (optional)</label>
        <input id="itemImage" type="file" accept="image/*" />
      </div>
      <div class="actions">
        <button class="secondary" onclick="closeItemModal()">Abbrechen</button>
        <button class="primary" onclick="addItem()">Speichern</button>
      </div>
    </div>
  </div>

  <div id="vintedModal" class="modal">
    <div class="modal-card">
      <h2>Vinted Produkt</h2>
      <div class="field">
        <label>Name</label>
        <input id="vintedName" placeholder="z. B. Levi's 501" />
      </div>
      <div class="field">
        <label>Kategorie</label>
        <select id="vintedCategory">
          <option>Hose</option>
          <option>Jeans</option>
          <option>Hemd</option>
          <option>T-Shirt</option>
          <option>Polo</option>
          <option>Jacke</option>
          <option>Schuhe</option>
          <option>Accessoire</option>
        </select>
      </div>
      <div class="field">
        <label>Größe</label>
        <input id="vintedSize" placeholder="z. B. M / 32 / 36" />
      </div>
      <div class="field">
        <label>Kaufpreis (€)</label>
        <input id="vintedBuy" type="number" step="0.01" placeholder="z. B. 12.50" />
      </div>
      <div class="field">
        <label>Verkaufspreis (€)</label>
        <input id="vintedSell" type="number" step="0.01" placeholder="z. B. 20.00" />
      </div>
      <div class="field">
        <label>Markt/Status</label>
        <select id="vintedStatus">
          <option value="lager">Im Lager</option>
          <option value="verkauft">Verkauft</option>
        </select>
      </div>
      <div class="field">
        <label>Foto (optional)</label>
        <input id="vintedImage" type="file" accept="image/*" />
      </div>
      <div class="actions">
        <button class="secondary" onclick="closeVintedModal()">Abbrechen</button>
        <button class="primary" onclick="addVintedItem()">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_ITEMS = 'wardrope-ai-items';
    const STORAGE_VINTED = 'wardrope-ai-vinted';
    const STORAGE_SOLD = 'wardrope-ai-sold';

    let activeTab = 'home';
    let filterValue = 'Alle';
    let searchValue = '';

    function defaultItems() {
      return [
        { id: 1, name: 'Weißes T-Shirt', category: 'T-Shirt', color: 'Weiß', style: 'Casual', status: 'clean', lastWornAt: null, image: '' },
        { id: 2, name: 'Dunkle Jeans', category: 'Jeans', color: 'Blau', style: 'Casual', status: 'clean', lastWornAt: null, image: '' },
        { id: 3, name: 'Marine Polo', category: 'Polo', color: 'Marine', style: 'Smart Casual', status: 'clean', lastWornAt: null, image: '' },
        { id: 4, name: 'Schwarze Sneaker', category: 'Schuhe', color: 'Schwarz', style: 'Casual', status: 'clean', lastWornAt: null, image: '' },
        { id: 5, name: 'Beige Chino', category: 'Hose', color: 'Beige', style: 'Smart Casual', status: 'in_wash', lastWornAt: null, image: '' }
      ];
    }

    function defaultVintedItems() {
      return [
        { id: 1, name: 'Levi 501', category: 'Jeans', size: '32', buy: 18.90, sell: 29.00, status: 'lager', image: '', soldAt: null },
        { id: 2, name: 'Polo Shirt', category: 'Polo', size: 'M', buy: 11.00, sell: 18.50, status: 'verkauft', image: '', soldAt: '2025-09-10' },
        { id: 3, name: 'Wool Blazer', category: 'Jacke', size: 'M', buy: 25.00, sell: 0, status: 'lager', image: '', soldAt: null }
      ];
    }

    let items = JSON.parse(localStorage.getItem(STORAGE_ITEMS) || 'null') || defaultItems();
    let vintedItems = JSON.parse(localStorage.getItem(STORAGE_VINTED) || 'null') || defaultVintedItems();

    function saveItems() {
      localStorage.setItem(STORAGE_ITEMS, JSON.stringify(items));
    }

    function saveVinted() {
      localStorage.setItem(STORAGE_VINTED, JSON.stringify(vintedItems));
    }

    function encodeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function iconFor(category) {
      const map = {
        'T-Shirt': '👕',
        'Polo': '👕',
        'Hemd': '👔',
        'Hose': '👖',
        'Jeans': '👖',
        'Jacke': '🧥',
        'Pullover': '🧶',
        'Schuhe': '👟',
        'Accessoire': '🧢'
      };
      return map[category] || '👚';
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function statusLabel(status) {
      if (status === 'clean') return 'Sauber';
      if (status === 'worn') return 'Getragen';
      return 'In der Wäsche';
    }

    function statusClass(status) {
      if (status === 'clean') return 'clean';
      if (status === 'worn') return 'worn';
      return 'wash';
    }

    function applyAutoLaundry() {
      const DAY_MS = 24 * 60 * 60 * 1000;
      items = items.map(item => {
        if (item.status === 'worn' && item.lastWornAt && Date.now() - item.lastWornAt > DAY_MS) {
          return { ...item, status: 'in_wash' };
        }
        return item;
      });
      saveItems();
    }

    function setStatus(id, status) {
      const item = items.find(x => x.id === id);
      if (!item) return;
      item.status = status;
      if (status === 'worn') item.lastWornAt = Date.now();
      saveItems();
      render();
    }

    function setVintedStatus(id, status) {
      const item = vintedItems.find(x => x.id === id);
      if (!item) return;
      item.status = status;
      if (status === 'verkauft') item.soldAt = new Date().toISOString();
      saveVinted();
      render();
    }

    function itemThumb(item) {
      if (item.image) {
        return `<img src="${item.image}" alt="${escapeHtml(item.name)}" />`;
      }
      return iconFor(item.category);
    }

    function itemCard(item) {
      return `
        <div class="card item-row">
          <div class="thumb">${itemThumb(item)}</div>
          <div class="item-main">
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="item-sub">${escapeHtml(item.category)} · ${escapeHtml(item.color)} · ${escapeHtml(item.style)}</div>
            <div class="row-actions">
              <span class="badge ${statusClass(item.status)}">${statusLabel(item.status)}</span>
              <button class="small-btn" onclick="setStatus(${item.id}, 'clean')">Sauber</button>
              <button class="small-btn" onclick="setStatus(${item.id}, 'worn')">Getragen</button>
              <button class="small-btn" onclick="setStatus(${item.id}, 'in_wash')">Wäsche</button>
            </div>
          </div>
          <select onchange="setStatus(${item.id}, this.value)">
            <option value="clean" ${item.status === 'clean' ? 'selected' : ''}>Sauber</option>
            <option value="worn" ${item.status === 'worn' ? 'selected' : ''}>Getragen</option>
            <option value="in_wash" ${item.status === 'in_wash' ? 'selected' : ''}>Wäsche</option>
          </select>
        </div>
      `;
    }

    function generateOutfits() {
      const tops = items.filter(x => x.status === 'clean' && ['T-Shirt', 'Polo', 'Hemd'].includes(x.category));
      const bottoms = items.filter(x => x.status === 'clean' && ['Hose', 'Jeans'].includes(x.category));
      const shoes = items.filter(x => x.status === 'clean' && x.category === 'Schuhe');
      const outerwear = items.filter(x => x.status === 'clean' && ['Jacke', 'Pullover'].includes(x.category));

      if (!tops.length || !bottoms.length || !shoes.length) {
        return '<div class="empty">Füge mindestens ein Oberteil, eine Hose und Schuhe hinzu, um Outfit-Vorschläge zu sehen.</div>';
      }

      const suggestions = [
        { title: 'Casual Daily Look', note: 'Locker, modern und für den Alltag ideal.' },
        { title: 'Smart Casual', note: 'Sauberer Stil mit einfachen Kombinationen.' },
        { title: 'Weekend Style', note: 'Leicht, bequem und ruhig.' }
      ];

      return suggestions.map((suggestion, index) => {
        const top = tops[index % tops.length];
        const bottom = bottoms[(index + 1) % bottoms.length];
        const shoe = shoes[(index + 2) % shoes.length];
        const jacket = outerwear.length ? outerwear[(index + 1) % outerwear.length] : null;

        const replacementOptions = buildAlternateOptions(top, bottom, shoe, jacket);

        return `
          <div class="card">
            <h3>${suggestion.title}</h3>
            <div class="meta">${suggestion.note}</div>
            <div class="badge clean">${88 + index * 4}% passend</div>
            <div class="badge">${iconFor(top.category)} ${escapeHtml(top.name)}</div>
            <div class="badge">${iconFor(bottom.category)} ${escapeHtml(bottom.name)}</div>
            <div class="badge">${iconFor(shoe.category)} ${escapeHtml(shoe.name)}</div>
            ${jacket ? `<div class="badge">${iconFor(jacket.category)} ${escapeHtml(jacket.name)}</div>` : ''}
            <div class="row-actions">
              <button class="pill-btn" onclick="markOutfitToday(${index})">Heute tragen</button>
              <button class="small-btn" onclick="toggleAlternatives(${index})">Alternativen</button>
            </div>
            <div id="alt-${index}" style="display:none; margin-top:10px;">
              ${replacementOptions}
            </div>
          </div>
        `;
      }).join('');
    }

    function buildAlternateOptions(top, bottom, shoe, jacket) {
      const options = [];
      const foundTop = items.filter(x => x.category === top.category && x.id !== top.id && x.status === 'clean');
      const foundBottom = items.filter(x => x.category === bottom.category && x.id !== bottom.id && x.status === 'clean');
      const foundShoe = items.filter(x => x.category === shoe.category && x.id !== shoe.id && x.status === 'clean');

      if (foundTop.length) options.push(`<div class="meta">Alternative Oberteil: ${foundTop.slice(0,2).map(x => escapeHtml(x.name)).join(', ')}</div>`);
      if (foundBottom.length) options.push(`<div class="meta">Alternative Hose: ${foundBottom.slice(0,2).map(x => escapeHtml(x.name)).join(', ')}</div>`);
      if (foundShoe.length) options.push(`<div class="meta">Alternative Schuhe: ${foundShoe.slice(0,2).map(x => escapeHtml(x.name)).join(', ')}</div>`);

      return options.length ? options.join('') : '<div class="meta">Keine alternativen Stücke in diesem Stil gefunden.</div>';
    }

    function toggleAlternatives(index) {
      const el = document.getElementById('alt-' + index);
      if (!el) return;
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function markOutfitToday(index) {
      const tops = items.filter(x => x.status === 'clean' && ['T-Shirt', 'Polo', 'Hemd'].includes(x.category));
      const bottoms = items.filter(x => x.status === 'clean' && ['Hose', 'Jeans'].includes(x.category));
      const shoes = items.filter(x => x.status === 'clean' && x.category === 'Schuhe');
      const outerwear = items.filter(x => x.status === 'clean' && ['Jacke', 'Pullover'].includes(x.category));

      if (!tops.length || !bottoms.length || !shoes.length) return;

      const top = tops[index % tops.length];
      const bottom = bottoms[(index + 1) % bottoms.length];
      const shoe = shoes[(index + 2) % shoes.length];
      const jacket = outerwear.length ? outerwear[(index + 1) % outerwear.length] : null;
      const outfit = [top, bottom, shoe, ...(jacket ? [jacket] : [])];

      outfit.forEach(piece => {
        const item = items.find(x => x.id === piece.id);
        if (item) {
          item.status = 'worn';
          item.lastWornAt = Date.now();
        }
      });

      saveItems();
      render();
    }

    function renderHome() {
      const cleanCount = items.filter(x => x.status === 'clean').length;
      const washCount = items.filter(x => x.status === 'in_wash').length;
      const wornCount = items.filter(x => x.status === 'worn').length;
      document.getElementById('app').innerHTML = `
        <div class="stats">
          <div class="stat"><div class="stat-label">Gesamt</div><div class="stat-value">${items.length}</div></div>
          <div class="stat"><div class="stat-label">Sauber</div><div class="stat-value">${cleanCount}</div></div>
          <div class="stat"><div class="stat-label">Getragen</div><div class="stat-value">${wornCount}</div></div>
          <div class="stat"><div class="stat-label">Wäsche</div><div class="stat-value">${washCount}</div></div>
        </div>
        <h2 class="section-title">Empfohlene Outfits</h2>
        <div class="grid">${generateOutfits()}</div>
      `;
    }

    function renderWardrobe() {
      const categories = ['Alle', ...new Set(items.map(x => x.category))];
      const filtered = items.filter(item => {
        const matchesCategory = filterValue === 'Alle' || item.category === filterValue;
        const matchesSearch = item.name.toLowerCase().includes(searchValue.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      document.getElementById('app').innerHTML = `
        <div class="toolbar">
          <select onchange="filterValue = this.value; render();">
            ${categories.map(c => `<option ${c === filterValue ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
          <input value="${escapeHtml(searchValue)}" oninput="searchValue = this.value; render();" placeholder="Suche nach Kleidungsstück..." />
        </div>
        <div class="grid">
          ${filtered.length ? filtered.map(itemCard).join('') : '<div class="empty">Keine passenden Kleidungsstücke gefunden.</div>'}
        </div>
      `;
    }

    function renderLaundry() {
      const washItems = items.filter(x => x.status === 'in_wash');
      const html = washItems.length
        ? `<div class="grid">${washItems.map(itemCard).join('')}</div>`
        : '<div class="empty">Alles ist sauber. Keine Wäsche aktuell.</div>';
      document.getElementById('app').innerHTML = html;
    }

    function renderOutfits() {
      document.getElementById('app').innerHTML = `
        <h2 class="section-title">Outfit-Vorschläge</h2>
        <div class="grid">${generateOutfits()}</div>
      `;
    }

    function renderVinted() {
      const sold = vintedItems.filter(x => x.status === 'verkauft');
      const lager = vintedItems.filter(x => x.status === 'lager');
      const totalEinnahmen = sold.reduce((sum, x) => sum + Number(x.sell || 0), 0);
      const totalProfit = sold.reduce((sum, x) => sum + (Number(x.sell || 0) - Number(x.buy || 0)), 0);
      const totalInvestition = lager.reduce((sum, x) => sum + Number(x.buy || 0), 0);

      const renderVintedCard = item => `
        <div class="card">
          <div class="item-row" style="border-top:0; padding-top:0;">
            <div class="thumb">${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name)}" />` : '🧦'}</div>
            <div class="item-main">
              <div class="item-name">${escapeHtml(item.name)}</div>
              <div class="item-sub">${escapeHtml(item.category)} · Größe ${escapeHtml(item.size)}</div>
              <div class="meta">Kauf: <span class="money">€${Number(item.buy || 0).toFixed(2)}</span> · Verkauf: <span class="money">€${Number(item.sell || 0).toFixed(2)}</span></div>
              <div class="meta"><span class="badge ${item.status === 'verkauft' ? 'success' : 'wash'}">${item.status === 'verkauft' ? 'Verkauft' : 'Im Lager'}</span></div>
            </div>
          </div>
          <div class="row-actions">
            <button class="small-btn" onclick="setVintedStatus(${item.id}, 'lager')">Im Lager</button>
            <button class="pill-btn" onclick="setVintedStatus(${item.id}, 'verkauft')">Als verkauft</button>
          </div>
          <div class="meta" style="margin-top:12px;">Profit: <span class="${(Number(item.sell || 0) - Number(item.buy || 0)) >= 0 ? 'profit-positive' : 'profit-negative'}">€${((Number(item.sell || 0) - Number(item.buy || 0))).toFixed(2)}</span></div>
        </div>
      `;

      document.getElementById('app').innerHTML = `
        <div class="stats">
          <div class="stat"><div class="stat-label">Im Lager</div><div class="stat-value">${lager.length}</div></div>
          <div class="stat"><div class="stat-label">Verkauft</div><div class="stat-value">${sold.length}</div></div>
          <div class="stat"><div class="stat-label">Einnahmen</div><div class="stat-value">€${totalEinnahmen.toFixed(2)}</div></div>
          <div class="stat"><div class="stat-label">Profit</div><div class="stat-value">€${totalProfit.toFixed(2)}</div></div>
        </div>

        <div class="toolbar">
          <button class="primary" onclick="openVintedModal()">＋ Produkt hinzufügen</button>
        </div>

        <h2 class="section-title">Lager</h2>
        <div class="vinted-grid">${lager.length ? lager.map(renderVintedCard).join('') : '<div class="empty">Noch keine Produkte im Lager.</div>'}</div>

        <h2 class="section-title">Verkauft</h2>
        <div class="vinted-grid">${sold.length ? sold.map(renderVintedCard).join('') : '<div class="empty">Noch keine Verkäufe erfasst.</div>'}</div>

        <div class="card" style="margin-top:18px;">
          <h3>Gesamtübersicht</h3>
          <div class="meta">Investiert: <span class="money">€${totalInvestition.toFixed(2)}</span></div>
          <div class="meta">Einnahmen: <span class="money">€${totalEinnahmen.toFixed(2)}</span></div>
          <div class="meta">Theoretischer Profit: <span class="${totalProfit >= 0 ? 'profit-positive' : 'profit-negative'}">€${totalProfit.toFixed(2)}</span></div>
        </div>
      `;
    }

    function render() {
      document.querySelectorAll('[data-tab]').forEach(button => {
        button.classList.toggle('active', button.dataset.tab === activeTab);
      });

      if (activeTab === 'home') renderHome();
      else if (activeTab === 'wardrobe') renderWardrobe();
      else if (activeTab === 'outfits') renderOutfits();
      else if (activeTab === 'laundry') renderLaundry();
      else renderVinted();
    }

    function openItemModal() {
      document.getElementById('itemModal').classList.add('open');
    }

    function closeItemModal() {
      document.getElementById('itemModal').classList.remove('open');
      document.getElementById('itemName').value = '';
      document.getElementById('itemImage').value = '';
    }

    function openVintedModal() {
      document.getElementById('vintedModal').classList.add('open');
    }

    function closeVintedModal() {
      document.getElementById('vintedModal').classList.remove('open');
      document.getElementById('vintedName').value = '';
      document.getElementById('vintedSize').value = '';
      document.getElementById('vintedBuy').value = '';
      document.getElementById('vintedSell').value = '';
      document.getElementById('vintedImage').value = '';
    }

    async function addItem() {
      const name = document.getElementById('itemName').value.trim();
      if (!name) {
        alert('Bitte gib einen Namen ein.');
        return;
      }

      const fileInput = document.getElementById('itemImage');
      let image = '';
      if (fileInput.files && fileInput.files[0]) {
        image = await encodeImage(fileInput.files[0]);
      }

      items.unshift({
        id: Date.now(),
        name,
        category: document.getElementById('itemCategory').value,
        color: document.getElementById('itemColor').value,
        style: document.getElementById('itemStyle').value,
        status: 'clean',
        lastWornAt: null,
        image
      });

      saveItems();
      closeItemModal();
      render();
    }

    async function addVintedItem() {
      const name = document.getElementById('vintedName').value.trim();
      if (!name) {
        alert('Bitte gib einen Namen ein.');
        return;
      }

      const fileInput = document.getElementById('vintedImage');
      let image = '';
      if (fileInput.files && fileInput.files[0]) {
        image = await encodeImage(fileInput.files[0]);
      }

      const product = {
        id: Date.now(),
        name,
        category: document.getElementById('vintedCategory').value,
        size: document.getElementById('vintedSize').value || 'Keine Größe',
        buy: Number(document.getElementById('vintedBuy').value || 0),
        sell: Number(document.getElementById('vintedSell').value || 0),
        status: document.getElementById('vintedStatus').value,
        image,
        soldAt: document.getElementById('vintedStatus').value === 'verkauft' ? new Date().toISOString() : null
      };

      vintedItems.unshift(product);
      saveVinted();
      closeVintedModal();
      render();
    }

    document.querySelectorAll('[data-tab]').forEach(button => {
      button.addEventListener('click', () => {
        activeTab = button.dataset.tab;
        render();
      });
    });

    applyAutoLaundry();
    render();
  </script>
</body>
</html>
