<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wardrope AI</title>
<style>
:root{--p:#5b35d5;--bg:#f6f5fb;--card:#fff;--text:#202124}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,#5b35d5,#8d6bea);color:white;padding:28px 22px}header h1{margin:0 0 5px;font-size:30px}main{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button,.primary,button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:600}.tabs button{background:#e5e0fa;color:#3b258d}.tabs button.active,.primary{background:var(--p);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--card);border-radius:16px;padding:17px;box-shadow:0 2px 12px #28205d12}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{min-width:130px}.stat b{display:block;font-size:28px;color:var(--p);margin-top:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}select,input{padding:10px;border:1px solid #ddd;border-radius:9px;background:white}.item{display:flex;gap:12px;align-items:center}.icon{width:54px;height:54px;border-radius:12px;background:#eee9ff;display:grid;place-items:center;font-size:27px}.muted{color:#666}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#eee;margin:4px 3px 0 0;font-size:12px}.clean{background:#d9f7df;color:#176b2a}.wash{background:#dceeff;color:#14528a}.worn{background:#fff0d6;color:#885500}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:20px}.modal>div{background:white;border-radius:16px;padding:22px;max-width:440px;width:100%}.modal input,.modal select{width:100%;margin:7px 0}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}@media(max-width:600px){main{padding:12px}}
</style>
</head>
<body>
<header><h1>Wardrope AI</h1><div>Dein digitaler Kleiderschrank</div></header>
<main><div class="tabs"><button class="active" data-tab="home">Start</button><button data-tab="wardrobe">Kleidung</button><button data-tab="outfits">Outfits</button><button data-tab="laundry">Wäsche</button><button class="primary" onclick="openModal()">＋ Kleidung hinzufügen</button></div><section id="app"></section></main>
<div class="modal" id="modal"><div><h2>Neue Kleidung</h2><input id="name" placeholder="Name, z. B. Weißes T-Shirt"><select id="category"><option>T-Shirt</option><option>Polo</option><option>Hemd</option><option>Hose</option><option>Jeans</option><option>Jacke</option><option>Pullover</option><option>Schuhe</option><option>Accessoire</option></select><select id="color"><option>Weiß</option><option>Schwarz</option><option>Blau</option><option>Marine</option><option>Beige</option><option>Grau</option><option>Rot</option><option>Grün</option></select><select id="style"><option>Casual</option><option>Smart Casual</option><option>Sportlich</option><option>Elegant</option></select><div class="actions"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="addItem()">Speichern</button></div></div></div>
<script>
const key='wardrope-items';let items=JSON.parse(localStorage.getItem(key)||'null')||[{id:1,name:'Weißes T-Shirt',category:'T-Shirt',color:'Weiß',style:'Casual',status:'clean'},{id:2,name:'Dunkle Jeans',category:'Jeans',color:'Blau',style:'Casual',status:'clean'},{id:3,name:'Schwarze Sneaker',category:'Schuhe',color:'Schwarz',style:'Casual',status:'clean'},{id:4,name:'Marine Polo',category:'Polo',color:'Marine',style:'Smart Casual',status:'clean'},{id:5,name:'Beige Chino',category:'Hose',color:'Beige',style:'Smart Casual',status:'in_wash'}];let tab='home';
function save(){localStorage.setItem(key,JSON.stringify(items))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function statusText(s){return s==='clean'?'Sauber':s==='worn'?'Getragen':'In der Wäsche'}function icon(c){return ({'T-Shirt':'👕','Polo':'👕','Hemd':'👔','Hose':'👖','Jeans':'👖','Jacke':'🧥','Pullover':'🧶','Schuhe':'👟','Accessoire':'🧢'})[c]||'👚'}function setStatus(id,s){items.find(x=>x.id===id).status=s;save();render()}function card(x){return `<div class="card item"><div class="icon">${icon(x.category)}</div><div style="flex:1"><b>${esc(x.name)}</b><div class="muted">${x.category} · ${x.color} · ${x.style}</div><span class="pill ${x.status}">${statusText(x.status)}</span></div><select onchange="setStatus(${x.id},this.value)"><option value="clean" ${x.status==='clean'?'selected':''}>Sauber</option><option value="worn" ${x.status==='worn'?'selected':''}>Getragen</option><option value="in_wash" ${x.status==='in_wash'?'selected':''}>Wäsche</option></select></div>`}
function outfits(){let top=items.filter(x=>x.status==='clean'&&['T-Shirt','Polo','Hemd'].includes(x.category)),bottom=items.filter(x=>x.status==='clean'&&['Hose','Jeans'].includes(x.category)),shoes=items.filter(x=>x.status==='clean'&&x.category==='Schuhe');if(!top.length||!bottom.length||!shoes.length)return '<div class="card">Füge mindestens ein Oberteil, eine Hose und Schuhe hinzu, um Outfits zu erhalten.</div>';return [0,1,2].map(i=>{let a=top[i%top.length],b=bottom[i%bottom.length],c=shoes[i%shoes.length];return `<div class="card"><h3>${['Casual Daily Look','Smart Casual','Weekend Style'][i]} <span class="pill clean">${84+i*5}% passend</span></h3><p>${a.color} und ${b.color} passen gut zusammen. Das Outfit ist für den Alltag geeignet.</p><span class="pill">${icon(a.category)} ${esc(a.name)}</span><span class="pill">${icon(b.category)} ${esc(b.name)}</span><span class="pill">${icon(c.category)} ${esc(c.name)}</span></div>`}).join('')}
function render(){let a=document.getElementById('app');if(tab==='home'){let clean=items.filter(x=>x.status==='clean').length,wash=items.filter(x=>x.status==='in_wash').length;a.innerHTML=`<div class="stats"><div class="card stat">Kleidungsstücke<b>${items.length}</b></div><div class="card stat">Verfügbar<b>${clean}</b></div><div class="card stat">Wäsche<b>${wash}</b></div></div><h2>Empfohlene Outfits</h2><div class="grid">${outfits()}</div>`}else if(tab==='wardrobe'){a.innerHTML=`<div class="toolbar"><select id="filter" onchange="render()"><option>Alle</option>${[...new Set(items.map(x=>x.category))].map(x=>`<option ${x===document.getElementById('filter')?.value?'selected':''}>${x}</option>`).join('')}</select><input id="search" placeholder="Suchen..." oninput="render()" value="${esc(document.getElementById('search')?.value||'')}"></div><div class="grid">${items.filter(x=>(!document.getElementById('filter')||document.getElementById('filter').value==='Alle'||x.category===document.getElementById('filter').value)&&(!document.getElementById('search')||x.name.toLowerCase().includes(document.getElementById('search').value.toLowerCase()))).map(card).join('')||'<div class="card">Noch keine Kleidung vorhanden.</div>'}</div>`}else if(tab==='outfits'){a.innerHTML='<h2>Outfit-Vorschläge</h2><div class="grid">'+outfits()+'</div>'}else{let w=items.filter(x=>x.status==='in_wash');a.innerHTML='<h2>Wäsche</h2>'+ (w.length?'<div class="grid">'+w.map(card).join('')+'</div>':'<div class="card">Alles ist sauber. 🎉</div>')}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});function openModal(){document.getElementById('modal').style.display='grid'}function closeModal(){document.getElementById('modal').style.display='none'}function addItem(){let n=document.getElementById('name').value.trim();if(!n)return alert('Bitte einen Namen eingeben.');items.unshift({id:Date.now(),name:n,category:document.getElementById('category').value,color:document.getElementById('color').value,style:document.getElementById('style').value,status:'clean'});save();closeModal();document.getElementById('name').value='';render()}render();
</script>
</body></html>
